        ' style="background:#FFFAEB;border-color:#FEDF89" data-field="jobs:' + j.id + ':intel">' + U.esc(j.intel) + '</textarea></div>' +

      '<div class="field-row">' +
        '<div class="field" style="flex:1 1 160px"><label>ระบบเดิม / คู่แข่ง</label><input class="inp" placeholder="เช่น SSB" data-field="jobs:' + j.id + ':incumbent" value="' + U.attr(j.incumbent) + '"></div>' +
        '<div class="field" style="flex:1 1 160px"><label>เลขที่โครงการ e-GP</label><input class="inp mono" data-field="jobs:' + j.id + ':egpProjectId" value="' + U.attr(j.egpProjectId) + '"></div>' +
        '<div class="field" style="flex:1 1 200px"><label>งานที่เกี่ยวข้อง</label>' + relatedEditor(j) + '</div>' +
      '</div>' +

      '<div class="field"><label>ผู้ติดต่อ</label>' + contactsEditor(j) + '</div>' +

      '<div class="btn-group" style="margin-top:12px">' +
        '<button class="btn btn-sm" data-act="disc:fromjob" data-id="' + j.id + '">' + U.ic('discuss') + 'ขอความเห็นเรื่องนี้</button>' +
        '<button class="btn btn-sm" data-act="plan:fromjob" data-id="' + j.id + '">' + U.ic('plan') + 'เพิ่มแผนงาน</button>' +
      '</div>' +
      (j.stageHistory && j.stageHistory.length
        ? '<div class="small muted" style="margin-top:10px">' + U.ic('history') + ' ประวัติสถานะ: ' +
          j.stageHistory.slice(-5).map(function (h) {
            return U.esc((h.from ? h.from.replace('_WON','') + '→' : '') + String(h.stage).replace('_WON','')) +
                   ' <span class="tiny">(' + U.esc(U.fmtDate(h.at)) + ')</span>';
          }).join(' · ') + '</div>'
        : '') +
    '</div>';
  }
  /* เปิดฟอร์มงานใน drawer — ฟอร์มผูกข้อมูลแบบสด จึงไม่มีปุ่มบันทึก
     ปิด drawer ตอนเพิ่มงานใหม่โดยยังไม่แก้ชื่อ = ลบงานเปล่าทิ้ง จะได้ไม่มี
     "(งานใหม่ — แก้ชื่อลูกค้า)" ค้างในบอร์ด */
  var PLACEHOLDER = '(งานใหม่ — แก้ชื่อลูกค้า)';

  function open(id, isNew) {
    var j = SP.U.byId(SP.state.jobs, id);
    if (!j) return;
    SP.ui.editingJob = id;
    SP.Drawer.open({
      title: isNew ? 'เพิ่มงานใหม่' : j.customerName, icon: 'hospital', wide: true,
      html: render(j),
      buttons: [
        { label:'ลบงานนี้', id:'del', cls:'btn btn-danger', icon:'trash' },
        { label:'เสร็จแล้ว', id:'ok', cls:'btn btn-primary', icon:'check' }
      ],
      onClick: function (id2) {
        if (id2 !== 'del') return;
        SP.Modal.confirm({
          title:'ลบงานนี้?', icon:'trash', danger:true, ok:'ลบ',
          html:'<p>กำลังจะลบ <b>' + SP.U.esc(j.customerName) + '</b> — ' + SP.U.esc(j.product) + '</p>' +
               '<p class="muted small">แผนงานและวาระที่ผูกกับงานนี้จะยังอยู่ แต่จะขึ้นป้ายว่า “งานที่อ้างถึงถูกลบ”</p>'
        }, function () {
          SP.Store.remove('jobs', j.id);
          SP.ui.editingJob = null;
          SP.Render.current();
          SP.Toast.show('ลบงานแล้ว', 'ok');
        });
      },
      onClose: function () {
        var cur = SP.U.byId(SP.state.jobs, id);
        if (isNew && cur && cur.customerName === PLACEHOLDER && !cur.product && !cur.value) {
          SP.Store.remove('jobs', id);
        }
        SP.ui.editingJob = null;
        SP.Render.view(SP.ui.activeTab);
        SP.Render.header();
      }
    });
  }

  /* วาดเนื้อหา drawer ใหม่ทุกครั้งที่ state เปลี่ยน ไม่งั้นชิปผู้รับผิดชอบ
     รายการผู้ติดต่อ และช่อง Trial ที่โผล่ตามขั้น จะค้างเป็นของเก่า */
  function sync() {
    if (!SP.ui.editingJob || !SP.Drawer.isOpen()) return;
    var j = SP.U.byId(SP.state.jobs, SP.ui.editingJob);
    if (!j) { SP.Drawer.close(); return; }
    var active = document.activeElement;
    var keep = active && active.getAttribute ? active.getAttribute('data-field') : null;
    var pos = (keep && active.selectionStart !== undefined) ? active.selectionStart : null;
    SP.Drawer.setBody(render(j));
    if (keep) {
      var again = SP.Drawer.el().querySelector('[data-field="' + keep + '"]');
      if (again) {
        try {
          again.focus();
          if (pos !== null && again.setSelectionRange) again.setSelectionRange(pos, pos);
        } catch (e) {}
      }
    }
  }

  return { render:render, open:open, sync:sync, PLACEHOLDER:PLACEHOLDER };
})();

/* -------------------------------------------------------------------------- */
SP.Board = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  function f() {
    SP.ui.filters = SP.ui.filters || {};
    return SP.ui.filters;
  }
  /* ตัวกรองแต่ละหมวดเป็น array — ว่าง = ไม่กรอง, มีค่า = ต้องตรงอย่างน้อยหนึ่งค่า
     (ภายในหมวดเดียวกันเป็น "หรือ" · ข้ามหมวดเป็น "และ") */
  function sel(k) {
    var v = f()[k];
    return Array.isArray(v) ? v : (v ? [v] : []);
  }
  function hit(k, value) {
    var list = sel(k);
    return !list.length || list.indexOf(value) >= 0;
  }
  function match(j) {
    var q = f();
    if (!hit('group', j.productGroup)) return false;
    if (!hit('level', j.budgetCode)) return false;
    if (!hit('cgroup', j.customerGroup)) return false;
    if (!hit('status', j.workStatus)) return false;
    if (!hit('incumbent', j.incumbent || '')) return false;
    var owners = sel('owner');
    if (owners.length) {
      var mine = U.normNames(j.assignedTo);
      if (!owners.some(function (o) { return mine.indexOf(o) >= 0; })) return false;
    }
    if (q.text) {
      var t = String(q.text).toLowerCase();
      var hay = [j.customerName, j.product, j.detail, j.remark, j.weekNote, j.province, j.incumbent]
        .join(' ').toLowerCase();
      if (hay.indexOf(t) < 0) return false;
    }
    return true;
  }

  function filtered() { return SP.state.jobs.filter(match); }

  function chipRow(label, key, items) {
    /* แถวที่มีตัวเลือกเดียว กรองอะไรไม่ได้ — ไม่ต้องแสดงให้เปลืองที่ */
    if (items.length < 2) return '';
    var cur = sel(key);
    return '<div class="filter-row">' +
      '<span class="flab">' + U.esc(label) + '</span>' +
      '<button class="chip chip-btn tiny" aria-pressed="' + !cur.length + '" data-act="board:filter" ' +
        'data-k="' + key + '" data-v="" style="padding-left:8px">ทั้งหมด</button>' +
      items.map(function (it) {
        var v = Array.isArray(it) ? it[0] : it, l = Array.isArray(it) ? it[1] : it;
        var on = cur.indexOf(v) >= 0;
        return '<button class="chip chip-btn tiny" aria-pressed="' + on + '" data-act="board:filter" data-k="' + key +
               '" data-v="' + U.attr(v) + '" style="padding-left:' + (on ? '3px' : '8px') + '">' +
               (on ? U.ic('check') : '') + U.esc(l) + '</button>';
      }).join('') +
      (cur.length > 1 ? '<span class="tiny muted">เลือก ' + cur.length + ' ค่า</span>' : '') +
      '</div>';
  }

  /* ป้ายชื่อของตัวกรองที่เลือกอยู่ ใช้ตอนยุบแผงเพื่อให้ยังเห็นว่ากรองอะไรค้างไว้ */
  var FILTER_LABEL = {
    group:'หมวดงาน', level:'ระดับงบ', cgroup:'กลุ่มลูกค้า',
    owner:'ผู้รับผิดชอบ', status:'สถานะงาน', incumbent:'ระบบเดิม'
  };
  function valueLabel(k, v) {
    if (k === 'group') return (C.PRODUCT_GROUPS[v] || {}).nameTH || v;
    if (k === 'status') return (C.WORK_STATUS[v] || {}).th || v;
    return v;
  }
  function activeFilters() {
    var out = [];
    Object.keys(FILTER_LABEL).forEach(function (k) {
      sel(k).forEach(function (v) { out.push({ k:k, v:v }); });
    });
    return out;
  }

  function toolbar() {
    var q = f();
    var incumbents = {};
    SP.state.jobs.forEach(function (j) { if (j.incumbent) incumbents[j.incumbent] = 1; });
    var owners = SP.state.owners.map(function (o) { return o.name; });
    var vis = SP.state.jobs.filter(function (j) { return j.presentVisible; }).length;
    var act = activeFilters();
    var open = !!SP.ui.filtersOpen;

    var panel = open
      ? '<div class="filters-panel">' +
          chipRow('หมวดงาน', 'group', Object.keys(C.PRODUCT_GROUPS).map(function (k) { return [k, C.PRODUCT_GROUPS[k].nameTH]; })) +
          chipRow('ระดับงบ', 'level', Object.keys(C.BUDGET_CODES)) +
          chipRow('กลุ่มลูกค้า', 'cgroup', C.CUSTOMER_GROUPS) +
          chipRow('ผู้รับผิดชอบ', 'owner', owners) +
          chipRow('สถานะงาน', 'status', Object.keys(C.WORK_STATUS).map(function (k) { return [k, C.WORK_STATUS[k].th]; })) +
          chipRow('ระบบเดิม', 'incumbent', Object.keys(incumbents)) +
        '</div>'
      : '';

    var chips = act.length
      ? '<span class="active-chips">' + act.map(function (a) {
          return '<span class="chip tiny">' + U.esc(FILTER_LABEL[a.k]) + ': ' + U.esc(valueLabel(a.k, a.v)) +
                 '<button class="chip-x" data-act="board:filter" data-k="' + a.k + '" data-v="' + U.attr(a.v) + '" ' +
                 'data-one="1" aria-label="ล้างตัวกรอง ' + U.attr(FILTER_LABEL[a.k]) + ': ' + U.attr(valueLabel(a.k, a.v)) + '">' +
                 U.ic('close') + '</button></span>';
        }).join('') +
        '<button class="btn btn-xs" data-act="board:clearfilters">ล้างทั้งหมด</button></span>'
      : '';

    return '<div class="card card-pad" style="margin-bottom:16px">' +
      '<div class="filters-bar">' +
        '<div class="center" style="flex:1 1 220px;min-width:180px">' + U.ic('search', 'muted') +
          '<input class="inp" placeholder="ค้นหาชื่อ รพ. / ระบบ / รายละเอียด" data-act-input="board:text" value="' + U.attr(q.text || '') + '">' +
        '</div>' +
        '<button class="btn btn-sm" data-act="board:togglefilters" aria-expanded="' + open + '">' +
          U.ic('filter') + 'ตัวกรอง' + (act.length ? ' (' + act.length + ')' : '') +
          U.ic(open ? 'chevron-up' : 'chevron-down') + '</button>' +
        chips +
        '<span class="spacer"></span>' +
        '<span class="badge badge-soft" title="งานที่จะขึ้นในรายงานสรุป">' + U.ic('eye') + vis + ' / ' + SP.state.jobs.length + '</span>' +
        '<button class="btn btn-sm" data-act="job:foldall" data-v="1" title="คลี่การ์ดทุกใบ">' +
          U.ic('chevron-down') + 'คลี่ทั้งหมด</button>' +
        '<button class="btn btn-sm" data-act="job:foldall" data-v="" title="ยุบการ์ดทุกใบ">' +
          U.ic('chevron-up') + 'ยุบทั้งหมด</button>' +
        '<button class="btn btn-sm" data-act="board:showall">แสดงทั้งหมด</button>' +
        '<button class="btn btn-sm" data-act="board:hideclosed">ซ่อนที่ปิดแล้ว</button>' +
        '<button class="btn btn-primary btn-sm" data-act="job:add">' + U.ic('plus') + 'เพิ่มงานใหม่</button>' +
      '</div>' + panel +
    '</div>';
  }

  function render() {
    var jobs = filtered();
    var cols = C.STAGES.map(function (s) {
      var list = jobs.filter(function (j) { return j.stage === s.id; });
      var val = U.sum(list, function (j) { return j.value; });
      return '<div class="bcol">' +
        '<div class="bcol-hd">' + U.stageDot(s.id) +
          '<span class="bcol-name">' + U.esc(s.id.replace('_WON','') + ' · ' + s.nameTH) + '</span>' +
          '<span class="badge badge-soft">' + list.length + '</span></div>' +
        '<div class="bcol-sum">' + (val > 0 ? U.esc(U.money(val)) : '—') + '</div>' +
        (list.length
          ? '<div class="stack">' + list.map(function (j) { return SP.JobCard.render(j); }).join('') + '</div>'
          : '<div class="tiny muted" style="padding:8px 2px">ไม่มีงานในขั้นนี้</div>') +
      '</div>';
    }).join('');

    return toolbar() +
      '<div class="small muted" style="margin-bottom:8px">แสดง ' + jobs.length + ' จาก ' + SP.state.jobs.length +
      ' งาน · มูลค่ารวม ' + U.esc(U.money(U.sum(jobs, function (j) { return j.value; }))) +
      ' · คาดได้รวม ' + U.esc(U.money(U.sum(jobs, function (j) { return C.jobExpected(j); }))) + '</div>' +
      '<div class="board-wrap">' +
        '<button class="board-nav prev" data-act="board:pan" data-d="-1" aria-label="เลื่อนไปคอลัมน์ก่อนหน้า">' +
          U.ic('chevron-left', 'ic-lg') + '</button>' +
        '<button class="board-nav next" data-act="board:pan" data-d="1" aria-label="เลื่อนไปคอลัมน์ถัดไป">' +
          U.ic('chevron-right', 'ic-lg') + '</button>' +
        '<div class="board" id="board-scroll">' + cols + '</div>' +
      '</div>' +
      '<div class="board-hint">เลื่อนคอลัมน์: ลากเมาส์ตรงไหนก็ได้ในบอร์ด · กดปุ่มลูกศรซ้าย-ขวา · หรือ Shift + ล้อเมาส์</div>';
  }

  return { render:render, filtered:filtered, f:f, sel:sel, activeFilters:activeFilters };
})();

SP.Render.register('board', SP.Board.render);

/* ---- actions ------------------------------------------------------------- */
SP.Actions.on('board:filter', function (ds) {
  var q = SP.Board.f();
  var cur = SP.Board.sel(ds.k);
  if (!ds.v) {
    q[ds.k] = [];                       // ปุ่ม "ทั้งหมด" = ล้างหมวดนี้
  } else {
    var i = cur.indexOf(ds.v);
    q[ds.k] = (i >= 0) ? cur.filter(function (x) { return x !== ds.v; }) : cur.concat([ds.v]);
  }
  SP.Store.saveUI();
  SP.Render.current();
});
/* เลื่อนทีละคอลัมน์ — 288px คือความกว้างคอลัมน์ + ช่องไฟ (ดู .bcol ใน CSS) */
SP.Actions.on('board:pan', function (ds) {
  var el = document.getElementById('board-scroll');
  if (el) el.scrollBy({ left: Number(ds.d) * 300, behavior: 'smooth' });
});
SP.Actions.on('board:togglefilters', function () {
  SP.ui.filtersOpen = !SP.ui.filtersOpen;
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('board:clearfilters', function () {
  var q = SP.Board.f();
  ['group','level','cgroup','owner','status','incumbent'].forEach(function (k) { q[k] = []; });
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('board:showall', function () {
  SP.state.jobs.forEach(function (j) { j.presentVisible = true; });
  SP.Store.touch(); SP.Render.current();
  SP.Toast.show('เปิดแสดงทุกงานในรายงานแล้ว', 'ok');
});
SP.Actions.on('board:hideclosed', function () {
  var n = 0;
  SP.state.jobs.forEach(function (j) {
    if (C.isClosed(j.stage)) { if (j.presentVisible) n++; j.presentVisible = false; }
  });
  SP.Store.touch(); SP.Render.current();
  SP.Toast.show('ซ่อนงานที่ปิดแล้ว ' + n + ' รายการ', 'ok');
});
SP.Actions.on('job:edit', function (ds) { SP.JobEdit.open(ds.id, false); });
SP.Actions.on('job:fold', function (ds) {
  SP.ui.openJobs = SP.ui.openJobs || {};
  if (SP.ui.openJobs[ds.id]) delete SP.ui.openJobs[ds.id];
  else SP.ui.openJobs[ds.id] = true;
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('job:foldall', function (ds) {
  SP.ui.openJobs = {};
  if (ds.v) SP.state.jobs.forEach(function (j) { SP.ui.openJobs[j.id] = true; });
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('job:present', function (ds) {
  var j = U_job(ds.id); if (!j) return;
  SP.Store.patch('jobs', j.id, { presentVisible: !j.presentVisible });
  SP.Render.current();
});
SP.Actions.on('job:highlight', function (ds) {
  var j = U_job(ds.id); if (!j) return;
  SP.Store.patch('jobs', j.id, { highlight: !j.highlight });
  SP.Render.current();
});
SP.Actions.on('job:recalc', function (ds) {
  var j = U_job(ds.id); if (!j) return;
  SP.Store.patch('jobs', j.id, { expectedRevenue: null });
  SP.Render.current();
  SP.Toast.show('คำนวณรายได้ที่คาดว่าจะได้ใหม่แล้ว', 'ok');
});
SP.Actions.on('job:goto', function (ds) {
  SP.Render.tab('board');
  SP.JobEdit.open(ds.id, false);
});
SP.Actions.on('job:owner', function (ds) {
  var j = U_job(ds.id); if (!j) return;
  var list = SP.U.normNames(j.assignedTo), i = list.indexOf(ds.name);
  if (i >= 0) list.splice(i, 1); else list.push(ds.name);
  SP.Store.patch('jobs', j.id, { assignedTo: list });
  SP.Render.current();
});
SP.Actions.on('job:related', function (ds) {
  var j = U_job(ds.id); if (!j) return;
  var list = (j.relatedTo || []).slice();
  var i = list.indexOf(ds.rel);
  if (i >= 0) list.splice(i, 1); else list.push(ds.rel);
  SP.Store.patch('jobs', j.id, { relatedTo: list });
  SP.Render.current();
});
SP.Actions.on('job:contact-add', function (ds) {
  var j = U_job(ds.id); if (!j) return;
  j.contacts = (j.contacts || []).concat([{ name:'', role:'', note:'' }]);
  SP.Store.touch(); SP.Render.current();
});
SP.Actions.on('job:contact-del', function (ds) {
  var j = U_job(ds.id); if (!j) return;
  j.contacts.splice(Number(ds.i), 1);
  SP.Store.touch(); SP.Render.current();
});
SP.Actions.on('job:add', function () {
  var j = SP.Norm.blankJob({
    id: SP.U.uid('J'), seedBatch:'manual', customerName: SP.JobEdit.PLACEHOLDER,
    isNewThisWeek:true, newSince: SP.U.nowISO(),
    assignedTo: SP.state.settings.defaultOwner ? [SP.state.settings.defaultOwner] : (SP.ui.me ? [SP.ui.me] : []),
    stageHistory: [{ stage:'S0', from:null, at:SP.U.nowISO(), weekOf:SP.state.meta.weekOf, note:'สร้างด้วยมือ' }]
  });
  SP.Store.add('jobs', j);
  SP.Render.tab('board');
  SP.JobEdit.open(j.id, true);
});
SP.Actions.on('job:del', function (ds) {
  var j = U_job(ds.id); if (!j) return;
  SP.Modal.confirm({
    title:'ลบงานนี้?', icon:'trash', danger:true, ok:'ลบ',
    html:'<p>กำลังจะลบ <b>' + SP.U.esc(j.customerName) + '</b> — ' + SP.U.esc(j.product) + '</p>' +
         '<p class="muted small">แผนงานและวาระที่ผูกกับงานนี้จะยังอยู่ แต่จะขึ้นป้ายว่า “งานที่อ้างถึงถูกลบ”</p>'
  }, function () {
    SP.Store.remove('jobs', j.id);
    SP.ui.editingJob = null;
    if (SP.Drawer.isOpen()) SP.Drawer.close();
    SP.Render.current();
    SP.Toast.show('ลบงานแล้ว', 'ok');
  });
});

function U_job(id) { return SP.U.byId(SP.state.jobs, id); }

/* ---- validation: เปลี่ยนเป็น blocked/waiting ต้องมีเหตุผล ------------------
   ไม่มีข้อนี้ ส่วน “งานที่หยุด/รอ” จะเต็มไปด้วยแถวไร้เหตุผลภายในสองสัปดาห์
   แล้วไม่มีใครอ่าน */
SP.Hooks.beforeField = function (coll, id, fieldName, v) {
  if (coll !== 'jobs') return;
  var j = U_job(id); if (!j) return;
  if (fieldName === 'workStatus' && v !== j.workStatus) {
    j.statusSince = (SP.C.NEEDS_REASON.indexOf(v) >= 0) ? SP.U.nowISO() : null;
  }
  if (fieldName === 'stage' && v !== j.stage) {
    j.stageHistory = (j.stageHistory || []).concat([{
      stage:v, from:j.stage, at:SP.U.nowISO(), weekOf:SP.state.meta.weekOf, note:'แก้ไขด้วยมือ'
    }]);
  }
  if (fieldName === 'isNewThisWeek') j.newSince = v ? SP.U.nowISO() : null;
  /* Level 1 = งบปีปัจจุบัน 2569 (js/modules/pipeline.js:1302-1328) */
  if (fieldName === 'budgetCode' && v === 'Level 1' && !j.budgetYear) j.budgetYear = '2569';
};
SP.Hooks.afterField = function (coll, id, fieldName, v) {
  if (coll !== 'jobs') return;
  var j = U_job(id); if (!j) return;
  if (fieldName === 'workStatus') {
    if (v === 'blocked' && !j.blockReason) SP.Toast.show('กรุณาระบุสาเหตุที่งานหยุด', 'warn');
    if (v === 'hold' && !j.blockReason) SP.Toast.show('กรุณาระบุว่าค้างเพราะอะไร', 'warn');
    if (v === 'waiting' && !j.waitingFor) SP.Toast.show('กรุณาระบุว่ารออะไรอยู่', 'warn');
  }
  if (fieldName === 'budgetCode' && v === 'Level 2' && !j.budgetYear) {
    SP.Toast.show('Level 2 ต้องระบุปีงบประมาณ เช่น 2570', 'warn');
  }
};
</script>

<script>
/* ============================================================================
   BLOCK 07 — VIEW: week  (รายงานประจำสัปดาห์ — แท็บเริ่มต้น และเป็นหน้าที่พิมพ์)
   จัดเป็น 2 ช่วงตามเรื่องเล่าของการประชุม: "ที่ผ่านมาได้อะไร" -> "ต่อไปทำอะไร"
   พร้อมแถบสรุปบรรทัดเดียวบนสุดให้จับภาพรวมได้ก่อนลงรายละเอียด
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Week = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  // ---- ตัวเลือกข้อมูลที่ทั้งหน้าสรุปและที่อื่นใช้ร่วมกัน --------------------
  function shown()   { return SP.state.jobs.filter(function (j) { return j.presentVisible; }); }
  function newJobs() { return shown().filter(function (j) { return j.isNewThisWeek; }); }
  /* รวมงานที่พักไว้ (S10) เข้ามาด้วย -- ถ้าไม่รวม งานที่ "ไม่ได้ทำต่อ" จะไม่โผล่
     ที่ไหนเลยในรายงาน เพราะ isClosed() ตัดมันออกจากทุกหัวข้ออื่นไปแล้ว */
  function stopped() {
    return shown().filter(function (j) {
      return C.NEEDS_REASON.indexOf(j.workStatus) >= 0 || C.isParked(j.stage);
    }).sort(byStuck);
  }
  function stuckSince(j) { return j.statusSince || j.parkedAt; }
  function byStuck(a, b) { return (U.daysSince(stuckSince(b)) || 0) - (U.daysSince(stuckSince(a)) || 0); }

  function lastHist(j) {
    var h = j.stageHistory || [];
    return h.length ? h[h.length - 1] : null;
  }
  function weekStart() { return new Date(SP.state.meta.weekOf + 'T00:00:00').getTime(); }

  /* Active ต่อเนื่อง = ยังไม่ปิด · ไม่ได้ติดธงใหม่ · แต่มีความเคลื่อนไหวใน 14 วัน
     ที่ประชุมต้องเห็นทั้งงานที่เพิ่งเข้ามาและงานที่ยังเดินอยู่ ไม่ใช่แค่ของใหม่ */
  function activeCont() {
    return shown().filter(function (j) {
      if (j.isNewThisWeek || C.isClosed(j.stage)) return false;
      var h = lastHist(j);
      var d = Math.min(
        U.daysSince(j.updatedAt) === null ? 9999 : U.daysSince(j.updatedAt),
        U.daysSince(h ? h.at : j.createdAt) === null ? 9999 : U.daysSince(h ? h.at : j.createdAt)
      );
      return d <= 14;
    });
  }

  /* งานที่ขยับขั้นในสัปดาห์นี้ */
  function moved() {
    var from = weekStart();
    return shown().map(function (j) {
      var h = lastHist(j);
      if (!h || !h.from) return null;
      var at = U.toDate(h.at);
      if (!at || at.getTime() < from) return null;
      var a = C.stage(h.from), b = C.stage(h.stage);
      if (!a || !b) return null;
      return {
        job:j, from:h.from, to:h.stage, fwd:(b.probability >= a.probability),
        delta: C.jobExpected(j) - C.expectedRevenue(j.value, h.from, j.budgetCode)
      };
    }).filter(Boolean);
  }

  /* สิ่งที่ "ได้มา" ส่วนใหญ่ยังไม่ขยับขั้น — ได้ข้อมูลวงใน ได้นัด ได้ตัวคนตัดสินใจ
     ถ้าวัดความคืบหน้าจากการขยับขั้นอย่างเดียว สัปดาห์แรกจะว่างเปล่าทั้งที่ทำงานมาทั้งสัปดาห์ */
  function noted() {
    var from = weekStart();
    var movedIds = {};
    moved().forEach(function (m) { movedIds[m.job.id] = 1; });
    return shown().filter(function (j) {
      if (movedIds[j.id] || !j.weekNote) return false;
      var d = U.toDate(j.updatedAt);
      return d && d.getTime() >= from;
    });
  }

  function stale(days) {
    days = days || 21;
    return shown().filter(function (j) {
      if (C.isClosed(j.stage)) return false;
      var h = lastHist(j);
      var d = U.daysSince(h ? h.at : j.createdAt);
      return d !== null && d >= days;
    }).sort(function (a, b) {
      return (U.daysSince((lastHist(b) || {}).at) || 0) - (U.daysSince((lastHist(a) || {}).at) || 0);
    });
  }
  function stuckNew(j) {
    var d = U.daysSince(j.newSince);
    return (d !== null && d > 14) ? d : null;
  }

  /* เดดไลน์ที่ต้องเฝ้า — รวม 3 แหล่งที่เดิมกระจายอยู่คนละที่ ไม่มีใครเตือน */
  function deadlines(within) {
    within = within || 14;
    var out = [];
    shown().forEach(function (j) {
      var t = U.trialInfo(j);
      if (t.mode === 'overdue') {
        out.push({ order:-t.over, kind:'trial', warn:true, job:j,
                   text:'Trial ครบกำหนดแล้ว ' + t.over + ' วัน — ต้องสรุปผล' });
      } else if (t.mode === 'running' && t.left !== null && t.left <= within) {
        out.push({ order:t.left, kind:'trial', warn:t.left <= 7, job:j,
                   text:'Trial ครบกำหนดในอีก ' + t.left + ' วัน (' + U.fmtDate(j.trialEnd) + ')' });
      } else if (t.mode === 'scheduled' && t.inDays !== null && t.inDays <= within) {
        out.push({ order:t.inDays, kind:'trial', warn:t.inDays < 0, job:j,
                   text: t.inDays >= 0 ? 'นัดสาธิตอีก ' + t.inDays + ' วัน (' + U.fmtDate(j.trialPlannedDate) + ')'
                                       : 'เลยวันนัดสาธิตมา ' + (-t.inDays) + ' วัน' });
      } else if (t.mode === 'waiting' && t.waited !== null && t.waited > 14) {
        out.push({ order:0, kind:'trial', warn:true, job:j,
                   text:'รอสาธิตมาแล้ว ' + t.waited + ' วัน ยังไม่กำหนดวัน' });
      }
    });
    /* ส่งมอบแล้วแต่เงินยังไม่เข้าเกิน 30 วัน -- งานค้างที่ไม่มีใครเตือน
       order เป็นลบเพื่อให้ลอยขึ้นบนสุดเหมือน Trial ที่เลยกำหนด */
    shown().forEach(function (j) {
      var d = U.deliveryInfo(j);
      if (d.mode === 'unpaid' && d.since !== null && d.since > 30) {
        out.push({ order:-d.since, kind:'pay', warn:true, job:j,
                   text:'ส่งมอบแล้ว ' + d.since + ' วัน ยังไม่ได้รับชำระ' });
      }
    });
    /* งานที่พักไว้ -- นัดทบทวนที่ใกล้ถึง และงานที่พักนานโดยไม่มีกำหนดกลับมา
       อย่างหลังคือกรณีที่หายเงียบได้ง่ายที่สุด จึงต้องมีอะไรคอยสะกิด */
    shown().forEach(function (j) {
      var p = U.parkInfo(j);
      if (p.mode === 'dated' && p.reviveIn !== null && p.reviveIn <= within) {
        out.push({ order:p.reviveIn, kind:'park', warn:p.reviveIn <= 0, job:j,
                   text: p.reviveIn >= 0
                     ? 'ถึงกำหนดกลับมาทบทวนอีก ' + p.reviveIn + ' วัน (' + U.fmtDate(j.reviveOn) + ')'
                     : 'เลยวันนัดทบทวนมา ' + (-p.reviveIn) + ' วัน' });
      } else if (p.mode === 'open' && p.warn) {
        out.push({ order:-p.since, kind:'park', warn:true, job:j,
                   text:'พักไว้ ' + p.since + ' วัน ยังไม่มีกำหนดกลับมาทำ — ควรตัดสินใจ' });
      }
    });
    SP.state.plans.forEach(function (p) {
      if (p.done || !p.dueDate) return;
      var j = p.jobId ? U.byId(SP.state.jobs, p.jobId) : null;
      if (j && !j.presentVisible) return;
      var left = U.dayDiff(U.today(), p.dueDate);
      if (left === null || left > within) return;
      out.push({ order:left, kind:'plan', warn:left <= 3, job:j, plan:p,
                 text: (left >= 0 ? 'กำหนดส่งอีก ' + left + ' วัน' : 'เลยกำหนดมา ' + (-left) + ' วัน') +
                       ' (' + U.fmtDate(p.dueDate) + ')' });
    });
    return out.sort(function (a, b) { return a.order - b.order; });
  }

  // ---- ชิ้นส่วนการแสดงผล --------------------------------------------------
  /* หัวข้อยุบได้ — key ใช้จำสถานะใน spw_v1_ui.folded (เป็นค่าเฉพาะเครื่อง
     ไม่เดินทางไปกับไฟล์ เพราะเป็นเรื่องการดูของแต่ละคน ไม่ใช่เนื้อหารายงาน) */
  function folded(key) { return !!(SP.ui.folded && SP.ui.folded[key]); }

  function sect(icon, title, sub, body, extraHd, key, count) {
    var f = key ? folded(key) : false;
    return '<section class="sect' + (f ? ' folded' : '') + '">' +
      '<div class="sect-hd' + (key ? ' can-fold' : '') + '"' +
        (key ? ' data-act="week:fold" data-k="' + key + '" role="button" aria-expanded="' + !f + '"' : '') + '>' +
        (key ? U.ic('chevron-down', 'fold-ic') : '') +
        '<h2>' + U.ic(icon, 'ic-lg') + U.esc(title) + '</h2>' +
        (sub ? '<span class="sub">' + U.esc(sub) + '</span>' : '') +
        (f && count ? '<span class="fold-count">' + U.esc(count) + '</span>' : '') +
        '<span class="spacer"></span>' + (extraHd || '') +
      '</div>' +
      '<div class="sect-body">' + body + '</div>' +
    '</section>';
  }
  function grid(jobs) {
    if (!jobs.length) return '';
    return '<div class="p-grid">' + jobs.map(function (j) { return SP.JobCard.render(j); }).join('') + '</div>';
  }
  function band(n, key, title, sub, body) {
    var f = folded(key);
    return '<div class="band' + (f ? ' folded' : '') + '">' +
      '<div class="band-hd can-fold" data-act="week:fold" data-k="' + key + '" role="button" aria-expanded="' + !f + '">' +
        '<span class="band-n">' + n + '</span>' +
        U.ic('chevron-down', 'fold-ic ic-lg') +
        '<div><h2>' + U.esc(title) + '</h2><div class="small muted">' + U.esc(sub) + '</div></div>' +
      '</div>' +
      '<div class="band-body">' + body + '</div>' +
    '</div>';
  }

  // ---- render -------------------------------------------------------------
  function render() {
    var s = SP.state;
    var nj = newJobs(), ac = activeCont(), stp = stopped();
    var mv = moved(), nt = noted(), st = stale(21), dl = deadlines(14);
    var won = shown().filter(function (j) { return C.isWon(j.stage); });
    var open = shown().filter(function (j) { return !C.isClosed(j.stage); });

    // ช่วงถัดไป = สัปดาห์ของ weekOf ถัดไป 1 สัปดาห์
    var w = U.toDate(s.meta.weekOf + 'T00:00:00') || new Date();
    var nx = new Date(w); nx.setDate(nx.getDate() + 7);
    var nxEnd = new Date(nx); nxEnd.setDate(nxEnd.getDate() + 6);
    var nextLabel = nx.getDate() + '–' + nxEnd.getDate() + ' ' + U.TH_MON[nxEnd.getMonth()] + ' ' + (nxEnd.getFullYear() + 543);

    var out = '';

    // ---------- หัวรายงาน + แถบสรุปบรรทัดเดียว ----------
    out += '<div class="card card-pad" style="margin-bottom:14px">' +
      '<div class="center" style="flex-wrap:wrap">' +
        '<div><h2 style="font-size:18px">' + U.esc(U.weekLabel(s.meta.weekOf)) + '</h2>' +
        '<div class="small muted">จัดทำโดย ' + U.esc(s.meta.preparedBy || SP.ui.me || '—') + '</div></div>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm no-print" data-act="week:foldall">' + U.ic('chevron-up') + 'ยุบทั้งหมด</button>' +
        '<button class="btn btn-sm no-print" data-act="week:unfoldall">' + U.ic('chevron-down') + 'กางทั้งหมด</button>' +
        '<button class="btn btn-sm no-print" data-act="week:clearnew">' + U.ic('refresh') +
          'ล้างธง “ใหม่” ทั้งหมด (' + nj.length + ')</button>' +
      '</div>' +
      '<div class="hr" style="margin:11px 0"></div>' +
      '<div class="summary-strip">' +
        '<span><b>' + nj.length + '</b> งานใหม่</span>' +
        '<span><b>' + ac.length + '</b> Active ต่อเนื่อง</span>' +
        '<span><b>' + mv.length + '</b> ขยับขั้น</span>' +
        '<span><b>' + won.length + '</b> เข้าสู่ดำเนินงาน</span>' +
        '<span class="' + (stp.length ? 'bad' : '') + '"><b>' + stp.length + '</b> หยุด/รอ/พักไว้</span>' +
        '<span class="' + (st.length ? 'warn' : '') + '"><b>' + st.length + '</b> ไม่ขยับ ≥ 3 สัปดาห์</span>' +
        '<span class="' + (dl.length ? 'warn' : '') + '"><b>' + dl.length + '</b> เดดไลน์ใน 14 วัน</span>' +
        '<span class="strip-sep"></span>' +
        '<span title="มูลค่ารวมของงานที่ยังไม่ปิด">มูลค่ารวม <b>' +
          U.esc(U.money(U.sum(open, function (j) { return j.value; }))) + '</b></span>' +
        '<span title="ถ่วงน้ำหนักด้วยขั้นตอน x ระดับงบ">คาดได้ <b>' +
          U.esc(U.money(U.sum(open, function (j) { return C.jobExpected(j); }))) + '</b></span>' +
      '</div></div>';

    // ================= ช่วง A — ทบทวนสัปดาห์ที่ผ่านมา =================
    var bodyA = '';

    var a1 = '';
    if (nj.length) {
      a1 += '<h3 class="sub-h">' + U.ic('new') + ' งานใหม่สัปดาห์นี้ (' + nj.length + ') · มูลค่ารวม ' +
            U.esc(U.money(U.sum(nj, function (j) { return j.value; }))) + '</h3>' +
            nj.map(function (j) {
              var warn = stuckNew(j);
              return (warn ? '<div class="banner banner-warn" style="margin-bottom:6px">' + U.ic('alert') +
                      'ติดธง “ใหม่” มา ' + warn + ' วันแล้ว — ควรล้างธงหลังประชุม</div>' : '');
            }).join('') + grid(nj);
    }
    if (ac.length) {
      a1 += '<h3 class="sub-h" style="margin-top:16px">' + U.ic('trend-up') +
            ' Active ต่อเนื่องจากสัปดาห์ก่อน (' + ac.length + ')</h3>' + grid(ac);
    }
    if (!a1) a1 = '<div class="empty">ยังไม่มีงานใหม่หรืองานที่เคลื่อนไหวใน 14 วัน — ติ๊ก “ใหม่สัปดาห์นี้” บนการ์ดงานเพื่อให้ขึ้นตรงนี้</div>';
    bodyA += sect('new', 'งานใหม่ / Active ต่อเนื่อง', (nj.length + ac.length) + ' รายการ', a1,
                  '', 'new', (nj.length + ac.length) + ' รายการ');

    var a2 = '';
    if (mv.length) a2 += moveBlock(mv);
    if (nt.length) {
      a2 += '<div class="card card-pad" style="margin-bottom:10px">' +
        '<div class="center" style="margin-bottom:8px">' + U.ic('info') +
        '<b>คืบหน้าแต่ยังไม่ขยับขั้น (' + nt.length + ')</b></div>' +
        '<div class="stack">' + nt.map(function (j) {
          return '<div><b>' + U.esc(j.customerName) + '</b> ' + U.stageBadge(j.stage) +
            '<div class="small muted">' + U.nl2br(j.weekNote) + '</div></div>';
        }).join('') + '</div></div>';
    }
    if (st.length) {
      a2 += '<div class="card card-pad">' +
        '<div class="center" style="margin-bottom:8px">' + U.ic('pause') +
        '<b>ไม่ขยับ ≥ 3 สัปดาห์ (' + st.length + ')</b></div>' +
        '<div class="stack">' + st.slice(0, 8).map(function (j) {
          var d = U.daysSince((lastHist(j) || {}).at || j.createdAt);
          return '<div class="center" style="gap:10px;flex-wrap:wrap">' +
            '<span class="badge badge-soft mono">' + d + ' วัน</span>' +
            '<b>' + U.esc(j.customerName) + '</b>' +
            '<span class="small muted">' + U.esc(j.product) + '</span>' + U.stageBadge(j.stage) +
            '<span class="spacer"></span>' +
            '<button class="btn btn-xs no-print" data-act="job:goto" data-id="' + j.id + '">เปิดงาน</button></div>';
        }).join('') + '</div>' +
        (st.length > 8 ? '<div class="tiny muted" style="margin-top:6px">และอีก ' + (st.length - 8) + ' รายการ</div>' : '') +
      '</div>';
    }
    if (!a2) a2 = '<div class="empty">สัปดาห์นี้ยังไม่มีความคืบหน้าที่บันทึกไว้</div>';
    bodyA += sect('trend-up', 'ความคืบหน้าสัปดาห์นี้', mv.length + ' ขยับขั้น · ' + nt.length + ' มีบันทึกใหม่', a2,
                  '', 'progress', (mv.length + nt.length) + ' รายการ');

    var a3 = stp.length ? grid(stp)
      : '<div class="empty">ไม่มีงานที่หยุด รอ Hold หรือไม่ได้ทำต่อ — ตั้งได้ที่ตัวแก้ไขของแต่ละงาน</div>';
    bodyA += sect('blocked', 'งานที่หยุด / รอ / Hold / ไม่ได้ทำต่อ', stp.length + ' รายการ', a3,
                  '', 'stopped', stp.length + ' รายการ');
    out += band('A', 'bandA', 'ทบทวนสัปดาห์ที่ผ่านมา', U.weekLabel(s.meta.weekOf), bodyA);

    // ================= ช่วง B — สัปดาห์นี้ / ที่จะถึง =================
    var bodyB = '';

    var b1 = dl.length
      ? '<div class="stack">' + dl.map(function (d) {
          return '<div class="center dl-row' + (d.warn ? ' warn' : '') + '" style="gap:10px;flex-wrap:wrap">' +
            U.ic(d.kind === 'trial' ? 'target'
                 : d.kind === 'pay'  ? 'money'
                 : d.kind === 'park' ? 'pause' : 'calendar') +
            '<b>' + U.esc(d.job ? d.job.customerName : 'เรื่องทั่วไป') + '</b>' +
            '<span class="small">' + U.esc(d.text) + '</span>' +
            (d.plan ? '<span class="small muted">— ' + U.esc(d.plan.action) + '</span>' : '') +
            '<span class="spacer"></span>' +
            (d.job ? '<button class="btn btn-xs no-print" data-act="job:goto" data-id="' + d.job.id + '">เปิดงาน</button>' : '') +
          '</div>';
        }).join('') + '</div>'
      : '<div class="empty">ไม่มีเดดไลน์ใน 14 วันข้างหน้า</div>';
    bodyB += sect('clock', 'เดดไลน์ที่ต้องเฝ้า', 'Trial ที่จะครบ · งานที่รอสาธิตนานเกิน · แผนที่มีกำหนดส่ง (14 วัน)',
                  b1, '', 'deadline', dl.length + ' รายการ');

    var wk = SP.state.plans.filter(function (p) { return p.bucket === 'W1' && !p.done; });
    var b2 = wk.length
      ? '<div class="stack">' + wk.map(function (p) {
          var j = p.jobId ? U.byId(SP.state.jobs, p.jobId) : null;
          return '<div class="center" style="gap:9px;flex-wrap:wrap">' + U.ic('plan', 'muted') +
            '<span>' + U.esc(p.action || '(ยังไม่ระบุงาน)') + '</span>' +
            (j ? '<span class="chip tiny">' + U.esc(j.customerName) + '</span>' : '<span class="badge badge-soft">เรื่องทั่วไป</span>') +
            (p.owner ? U.ownerChip(p.owner) : '') +
            SP.PlanView.planDates(p) +
          '</div>';
        }).join('') + '</div>'
      : '<div class="empty">ยังไม่มีแผนสัปดาห์นี้</div>';
    bodyB += sect('plan', 'แผนสัปดาห์นี้', wk.length + ' งาน',
      '<div class="card card-pad">' + b2 + '</div>',
      '<button class="btn btn-sm no-print" data-act="tab" data-id="plan">' + U.ic('edit') + 'แก้ไขแผนงาน</button>',
      'planwk', wk.length + ' งาน');

    var dsc = SP.state.discussions.filter(function (d) {
      if (d.status === 'decided') return false;
      if (!d.jobId) return true;
      var j = U.byId(SP.state.jobs, d.jobId);
      return !j || j.presentVisible;
    });
    var b3 = dsc.length
      ? '<div class="stack">' + dsc.map(function (d) {
          var a = C.ASK_TYPES[d.askType] || C.ASK_TYPES.opinion;
          var j = d.jobId ? U.byId(SP.state.jobs, d.jobId) : null;
          return '<div>' +
            '<div class="center" style="gap:8px;flex-wrap:wrap">' +
              '<span class="badge" style="background:' + a.bg + ';color:' + a.color + ';border:1px solid ' + a.bd + '">' + U.esc(a.th) + '</span>' +
              '<b>' + U.esc(d.topic || '(ยังไม่ได้ตั้งหัวข้อ)') + '</b>' +
              (j ? '<span class="chip tiny">' + U.esc(j.customerName) + '</span>' : '') +
            '</div>' +
            (d.context ? '<div class="small muted">' + U.nl2br(d.context) + '</div>' : '') +
          '</div>';
        }).join('') + '</div>'
      : '<div class="empty">ไม่มีเรื่องรอสรุป</div>';
    bodyB += sect('discuss', 'เรื่องขอความเห็น / ขอมติ', dsc.length + ' เรื่อง',
      '<div class="card card-pad">' + b3 + '</div>',
      '<button class="btn btn-sm no-print" data-act="tab" data-id="discuss">' + U.ic('edit') + 'จัดการวาระ</button>',
      'discuss', dsc.length + ' เรื่อง');
    out += band('B', 'bandB', 'สัปดาห์นี้ / ที่จะถึง', nextLabel, bodyB);

    return out;
  }

  function moveBlock(list) {
    var fwd = list.filter(function (m) { return m.fwd; });
    var back = list.filter(function (m) { return !m.fwd; });
    function rows(arr, icon, label) {
      if (!arr.length) return '';
      return '<div class="center" style="margin:8px 0 6px">' + U.ic(icon) + '<b>' + U.esc(label) + ' (' + arr.length + ')</b></div>' +
        '<div class="stack">' + arr.map(function (m) {
          var a = C.stage(m.from), b = C.stage(m.to);
          var col = m.delta > 0 ? '#027A48' : (m.delta < 0 ? '#B42318' : '#667085');
          return '<div class="center" style="gap:9px;flex-wrap:wrap">' +
            '<b style="min-width:140px">' + U.esc(m.job.customerName) + '</b>' +
            '<span class="badge badge-stage" style="background:' + (C.STAGE_COLORS[m.from] || '#98A2B3') + '">' + U.esc(m.from) + '</span>' +
            U.ic('arrow-right', 'muted') +
            '<span class="badge badge-stage" style="background:' + (C.STAGE_COLORS[m.to] || '#98A2B3') + '">' + U.esc(m.to) + '</span>' +
            '<span class="small muted">' + U.esc(a.nameTH + ' → ' + b.nameTH) + '</span>' +
            '<span class="spacer"></span>' +
            (m.delta ? '<span class="small mono" style="color:' + col + '">คาดได้ ' + (m.delta > 0 ? '+' : '') + U.esc(U.money(m.delta)) + '</span>' : '') +
            '<button class="btn btn-xs no-print" data-act="job:goto" data-id="' + m.job.id + '">เปิดงาน</button>' +
          '</div>';
        }).join('') + '</div>';
    }
    return '<div class="card card-pad" style="margin-bottom:10px">' +
      rows(fwd, 'trend-up', 'ก้าวหน้า') + rows(back, 'trend-down', 'ถอยหลัง') + '</div>';
  }

  return {
    render:render, shown:shown, newJobs:newJobs, activeCont:activeCont, stopped:stopped,
    moved:moved, noted:noted, stale:stale, deadlines:deadlines, lastHist:lastHist, stuckNew:stuckNew
  };
})();

SP.Render.register('week', SP.Week.render);

var FOLD_KEYS = ['bandA', 'new', 'progress', 'stopped', 'bandB', 'deadline', 'planwk', 'discuss'];

SP.Actions.on('week:fold', function (ds) {
  SP.ui.folded = SP.ui.folded || {};
  SP.ui.folded[ds.k] = !SP.ui.folded[ds.k];
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('week:foldall', function () {
  SP.ui.folded = {};
  FOLD_KEYS.forEach(function (k) { SP.ui.folded[k] = true; });
  SP.Store.saveUI();
  SP.Render.current();
});
SP.Actions.on('week:unfoldall', function () {
  SP.ui.folded = {};
  SP.Store.saveUI();
  SP.Render.current();
});

/* พิธีกรรมประจำสัปดาห์ — กดหลังประชุมจบ
   นี่คือสิ่งที่ทำให้ธงแบบติ๊กเองอยู่รอดข้ามสัปดาห์ได้ */
SP.Actions.on('week:clearnew', function () {
  var n = SP.Week.newJobs().length;
  if (!n) { SP.Toast.show('ไม่มีงานที่ติดธง “ใหม่” อยู่', 'warn'); return; }
  SP.Modal.confirm({
    title:'ล้างธง “ใหม่สัปดาห์นี้” ทั้งหมด?', icon:'refresh', ok:'ล้างธงทั้งหมด',
    html:'<p>จะล้างธงของ <b>' + n + ' งาน</b> — ข้อมูลงานไม่หาย และงานจะย้ายไปอยู่กลุ่ม “Active ต่อเนื่อง” แทน</p>' +
         '<p class="muted small">ปกติกดหลังประชุมจบ เพื่อให้สัปดาห์หน้าเริ่มนับใหม่</p>'
  }, function () {
    SP.state.jobs.forEach(function (j) { j.isNewThisWeek = false; j.newSince = null; });
    SP.Store.touch();
    SP.Render.current();
    SP.Toast.show('ล้างธง “ใหม่” ' + n + ' รายการแล้ว', 'ok');
  });
});
</script>

<script>
/* ============================================================================
   BLOCK 08 — VIEW: plan + discuss
   plans/discussions เป็น array แยก มี jobId เป็น null ได้
   -> ได้ทั้ง "ผูกกับงาน" และ "เรื่องทั่วไป" โดยไม่ต้องมี index สองฝั่ง
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.PlanView = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  function job(id) { return id ? U.byId(SP.state.jobs, id) : null; }
  function jobLabel(id) {
    if (!id) return '<span class="badge badge-soft">เรื่องทั่วไป</span>';
    var j = job(id);
    if (!j) return '<span class="badge" style="background:#FEF3F2;color:#B42318">' + U.ic('alert') + 'งานที่อ้างถึงถูกลบ</span>';
    return '<button class="chip chip-btn tiny" data-act="job:goto" data-id="' + j.id + '" style="padding-left:8px">' +
           U.ic('hospital') + U.esc(j.customerName) + '</button>';
  }
  function ownerSelect(cur, coll, id, fieldName) {
    var owners = SP.state.owners.filter(function (o) { return o.active || o.name === cur; });
    return '<select class="inp" style="max-width:150px" data-field="' + coll + ':' + id + ':' + (fieldName || 'owner') + '">' +
      '<option value="">— ผู้รับผิดชอบ —</option>' +
      owners.map(function (o) {
        return '<option value="' + U.attr(o.name) + '"' + (o.name === cur ? ' selected' : '') + '>' + U.esc(o.name) + '</option>';
      }).join('') +
      (cur && !U.ownerByName(cur) ? '<option value="' + U.attr(cur) + '" selected>' + U.esc(cur) + ' (ไม่อยู่ในรายชื่อ)</option>' : '') +
      '</select>';
  }
  function jobSelect(cur, coll, id) {
    return '<select class="inp" style="max-width:210px" data-field="' + coll + ':' + id + ':jobId">' +
      '<option value="">— เรื่องทั่วไป (ไม่ผูกงาน) —</option>' +
      SP.state.jobs.map(function (j) {
        return '<option value="' + j.id + '"' + (j.id === cur ? ' selected' : '') + '>' +
               U.esc(j.customerName + ' — ' + (j.product || '')) + '</option>';
      }).join('') + '</select>';
  }

  /* คำอธิบายใต้หัวการ์ดแต่ละใบ — เขียนช่วงเวลาให้ชัด จะได้ไม่มีใครต้องเดา */
  function bucketSub(id) {
    var w = U.toDate(SP.state.meta.weekOf + 'T00:00:00') || new Date();
    if (id === 'W1') {
      var a = U.monday(w), b = new Date(a); b.setDate(b.getDate() + 6);
      return (a.getMonth() === b.getMonth()
        ? a.getDate() + '–' + b.getDate() + ' ' + U.TH_MON[b.getMonth()]
        : a.getDate() + ' ' + U.TH_MON[a.getMonth()] + ' – ' + b.getDate() + ' ' + U.TH_MON[b.getMonth()]
      ) + ' ' + (b.getFullYear() + 543);
    }
    if (id === 'M0') {
      var last = new Date(w.getFullYear(), w.getMonth() + 1, 0);
      return U.TH_MONF[w.getMonth()] + ' ' + (w.getFullYear() + 543) +
             ' — เหลืออีก ' + (last.getDate() - w.getDate()) + ' วัน';
    }
    return 'ยังไม่ระบุวันที่ หรือเลยเดือนนี้ไปแล้ว';
  }

  /* ทุกแผนควรอ่านออกว่าเริ่มเมื่อไรและต้องเสร็จเมื่อไร
     ถ้าเลยกำหนดแล้วต้องเห็นทันทีโดยไม่ต้องคำนวณเอง */
  function planDates(p) {
    if (!p.startDate && !p.dueDate) return '<span class="badge badge-soft">ยังไม่ระบุวัน</span>';
    var left = p.dueDate ? U.dayDiff(U.today(), p.dueDate) : null;
    var late = !p.done && left !== null && left < 0;
    var soon = !p.done && left !== null && left >= 0 && left <= 3;
    var style = late ? 'background:#FEF3F2;color:#B42318' : (soon ? 'background:#FFFAEB;color:#B54708' : '');
    return '<span class="badge badge-soft plan-dates" style="' + style + '">' + U.ic('calendar') +
      (p.startDate ? 'เริ่ม ' + U.esc(U.fmtDate(p.startDate)) : 'ยังไม่ระบุวันเริ่ม') +
      (p.dueDate ? ' → เสร็จ ' + U.esc(U.fmtDate(p.dueDate)) : ' → ยังไม่ระบุกำหนดเสร็จ') +
      (left === null || p.done ? '' :
        (left < 0 ? ' · เลยมา ' + (-left) + ' วัน' : (left === 0 ? ' · ครบวันนี้' : ' · เหลือ ' + left + ' วัน'))) +
    '</span>';
  }

  function planRow(p) {
    var j = job(p.jobId);
    return '<div class="plan-item' + (p.done ? ' done' : '') + '">' +
      '<label class="check" style="margin-top:2px"><input type="checkbox" data-field="plans:' + p.id + ':done"' +
        (p.done ? ' checked' : '') + ' aria-label="ทำเสร็จแล้ว"></label>' +
      '<div style="flex:1 1 auto;min-width:0">' +
        '<div class="plan-act">' + U.esc(p.action || '(ยังไม่ระบุงาน)') + '</div>' +
        '<div class="job-meta tiny">' + jobLabel(p.jobId) +
          (p.owner ? U.ownerChip(p.owner) : '') +
          planDates(p) +
        '</div>' +
      '</div>' +
      '<div class="job-acts">' +
        '<button class="btn btn-icon btn-ghost muted" data-act="plan:edit" data-id="' + p.id +
          '" title="แก้ไขรายการนี้" aria-label="แก้ไข">' + U.ic('edit') + '</button>' +
      '</div>' +
    '</div>';
  }

  /* ---- ฟอร์มเพิ่ม/แก้แผนงานใน drawer -------------------------------------
     ย้ายออกจากการแก้ในบรรทัด เพราะช่องแคบ ไม่มีป้ายกำกับ และการ์ดกระโดดทุกครั้ง
     ที่กางฟอร์ม · ปุ่มวันที่ลัดช่วยไม่ต้องเปิดปฏิทินสำหรับเคสที่ใช้บ่อยที่สุด */
  function openPlanDrawer(p, isNew) {
    var owners = SP.state.owners.filter(function (o) { return o.active || o.name === p.owner; });
    var html =
      '<div class="field"><label>งานที่ต้องทำ</label>' +
        '<textarea class="inp" id="pf-action" rows="3" placeholder="เช่น นัดทีม DEV ประเมินราคา RCM">' + U.esc(p.action) + '</textarea></div>' +
      '<div class="field"><label>ช่วงเวลา</label><div class="seg" id="pf-bucket">' +
        C.BUCKETS.map(function (b) {
          return '<button type="button" data-act="plan:bucket" data-v="' + b.id + '" aria-pressed="' +
                 (p.bucket === b.id) + '">' + U.esc(b.th) + '</button>';
        }).join('') + '</div>' +
        '<div class="hint">' + U.esc(bucketSub(p.bucket)) + '</div></div>' +
      '<div class="field"><label>ผู้รับผิดชอบ</label>' +
        '<select class="inp" id="pf-owner"><option value="">— ไม่ระบุ —</option>' +
        owners.map(function (o) {
          return '<option value="' + U.attr(o.name) + '"' + (o.name === p.owner ? ' selected' : '') + '>' + U.esc(o.name) + '</option>';
        }).join('') + '</select></div>' +
      '<div class="field-row">' +
        '<div class="field" style="flex:1 1 150px"><label>เริ่มเมื่อ</label>' +
          '<input class="inp" type="date" id="pf-start" value="' + U.attr(p.startDate || '') + '">' +
          '<div class="quick-dates">' +
            '<button class="btn btn-xs" data-act="plan:quickdate" data-f="start" data-d="0">วันนี้</button>' +
            '<button class="btn btn-xs" data-act="plan:quickdate" data-f="start" data-d="1">พรุ่งนี้</button>' +
            '<button class="btn btn-xs" data-act="plan:quickdate" data-f="start" data-d="">ล้าง</button>' +
          '</div></div>' +
        '<div class="field" style="flex:1 1 150px"><label>กำหนดเสร็จ</label>' +
          '<input class="inp" type="date" id="pf-due" value="' + U.attr(p.dueDate || '') + '">' +
          '<div class="quick-dates">' +
            '<button class="btn btn-xs" data-act="plan:quickdate" data-f="due" data-d="3">อีก 3 วัน</button>' +
            '<button class="btn btn-xs" data-act="plan:quickdate" data-f="due" data-d="7">อีก 1 สัปดาห์</button>' +
            '<button class="btn btn-xs" data-act="plan:quickdate" data-f="due" data-d="">ล้าง</button>' +
          '</div></div>' +
      '</div>' +
      '<div class="field"><label>ผูกกับงาน</label>' +
        '<select class="inp" id="pf-job"><option value="">— เรื่องทั่วไป (ไม่ผูกงาน) —</option>' +
        SP.state.jobs.map(function (x) {
          return '<option value="' + x.id + '"' + (x.id === p.jobId ? ' selected' : '') + '>' +
                 U.esc(x.customerName + ' — ' + (x.product || '')) + '</option>';
        }).join('') + '</select></div>' +
      (isNew ? '' :
        '<label class="check" style="margin-top:6px"><input type="checkbox" id="pf-done"' +
        (p.done ? ' checked' : '') + '>ทำเสร็จแล้ว</label>');

    SP.Drawer.open({
      title: isNew ? 'เพิ่มแผนงาน' : 'แก้ไขแผนงาน', icon: 'plan', html: html,
      buttons: (isNew ? [] : [{ label:'ลบ', id:'del', cls:'btn btn-danger', icon:'trash' }])
        .concat([
          { label:'ยกเลิก', id:'no', cls:'btn' },
          { label: isNew ? 'เพิ่ม' : 'บันทึก', id:'save', cls:'btn btn-primary', icon:'check' }
        ]),
      onClick: function (id, root) {
        if (id === 'del') {
          SP.Store.remove('plans', p.id);
          SP.Render.current();
          SP.Toast.show('ลบรายการแผนงานแล้ว', 'ok');
          return;
        }
        if (id !== 'save') {
          if (isNew) SP.Store.remove('plans', p.id);   // กดยกเลิกตอนเพิ่ม = ไม่ต้องเหลือแถวเปล่า
          SP.Render.current();
          return;
        }
        var doneEl = root.querySelector('#pf-done');
        SP.Store.patch('plans', p.id, {
          action:   root.querySelector('#pf-action').value.trim(),
          bucket:   draftBucket || p.bucket,
          owner:    root.querySelector('#pf-owner').value,
          startDate: root.querySelector('#pf-start').value || null,
          dueDate:  root.querySelector('#pf-due').value || null,
          jobId:    root.querySelector('#pf-job').value || null,
          done:     doneEl ? doneEl.checked : p.done
        });
        SP.Render.current();
        SP.Toast.show(isNew ? 'เพิ่มแผนงานแล้ว' : 'บันทึกแล้ว', 'ok');
      }
    });
    draftBucket = p.bucket;
  }
  var draftBucket = 'W1';
  function setDraftBucket(v) {
    draftBucket = v;
    var seg = SP.Drawer.el().querySelector('#pf-bucket');
    if (!seg) return;
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false');
    });
    var hint = seg.parentNode.querySelector('.hint');
    if (hint) hint.textContent = bucketSub(v);
  }

  function render() {
    var cols = C.BUCKETS.map(function (b) {
      var list = SP.state.plans.filter(function (p) { return p.bucket === b.id; });
      var open = list.filter(function (p) { return !p.done; });
      var done = list.filter(function (p) { return p.done; });
      var val = U.sum(open, function (p) { var j = job(p.jobId); return j ? j.value : 0; });
      return '<div class="plan-col">' +
        '<div class="plan-col-hd">' + U.ic('plan') + '<h3>' + U.esc(b.th) + '</h3>' +
          '<span class="spacer"></span><span class="badge badge-soft">' + open.length + '</span></div>' +
        '<div class="plan-col-sub">' + U.esc(bucketSub(b.id)) + '</div>' +
        (open.length ? open.map(planRow).join('') : '<div class="tiny muted" style="padding:6px 0">ยังไม่มีงานในช่วงนี้</div>') +
        (done.length
          ? '<details style="margin-top:6px"><summary class="tiny muted" style="cursor:pointer">แสดงที่ทำแล้ว (' + done.length + ')</summary>' +
            done.map(planRow).join('') + '</details>'
          : '') +
        '<div class="plan-col-ft center">' +
          '<button class="btn btn-xs" data-act="plan:add" data-bucket="' + b.id + '">' + U.ic('plus') + 'เพิ่มงาน</button>' +
          '<span class="spacer"></span>' +
          '<span class="mono">' + open.length + ' งาน' + (val ? ' · เกี่ยวข้อง ' + U.esc(U.money(val)) : '') + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
    return '<div class="sect-hd"><h2>' + U.ic('plan', 'ic-lg') + 'แผนงาน</h2>' +
      '<span class="sub">ช่วงเวลาเลือกเอง ไม่ผูกกับวันที่ — เพราะ “ช่วงไหน” คือสิ่งที่ที่ประชุมคุยกันจริง</span></div>' +
      '<div class="plan-cols">' + cols + '</div>';
  }

  return { render:render, jobLabel:jobLabel, ownerSelect:ownerSelect, jobSelect:jobSelect,
           bucketSub:bucketSub, job:job, planDates:planDates,
           openPlanDrawer:openPlanDrawer, setDraftBucket:setDraftBucket };
})();

  SP.PlanView.openPlanDrawer(p, true);
});

/* -------------------------------------------------------------------------- */
SP.DiscView = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  function card(d) {
    var a = C.ASK_TYPES[d.askType] || C.ASK_TYPES.opinion;
    var j = d.jobId ? U.byId(SP.state.jobs, d.jobId) : null;
    return '<div class="disc' + (d.status === 'decided' ? ' decided' : '') + '">' +
      '<div class="center" style="flex-wrap:wrap">' +
        '<span class="badge" style="background:' + a.bg + ';color:' + a.color + ';border:1px solid ' + a.bd + '">' + U.esc(a.th) + '</span>' +
        SP.PlanView.jobLabel(d.jobId) +
        (d.proposedBy ? U.ownerChip(d.proposedBy) : '') +
        '<span class="badge badge-soft">' + U.esc(C.DISC_STATUS[d.status] || d.status) + '</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-icon btn-ghost muted" data-act="disc:edit" data-id="' + d.id + '" title="แก้ไขวาระนี้" aria-label="แก้ไข">' +
          U.ic('edit') + '</button>' +
      '</div>' +
      '<div class="disc-topic">' + U.esc(d.topic || '(ยังไม่ได้ตั้งหัวข้อ)') + '</div>' +
      (d.context ? '<div class="disc-ctx">' + U.nl2br(d.context) + (j ? ' <span class="tiny muted">— ' + U.esc(j.customerName) + '</span>' : '') + '</div>' : '') +
      (d.options ? '<div class="disc-opts">' + U.ic('info') + ' <b>ตัวเลือก:</b> ' + U.nl2br(d.options) + '</div>' : '') +
      (d.decision
        ? '<div class="disc-min"><b>' + U.ic('check-circle') + ' มติ:</b> ' + U.nl2br(d.decision) +
          '<div class="tiny muted">' + (d.decidedBy ? 'โดย ' + U.esc(d.decidedBy) : '') +
          (d.decidedAt ? ' · ' + U.esc(U.fmtDate(d.decidedAt, 'datetime')) : '') + '</div></div>'
        : '') +
    '</div>';
  }

  /* ---- ฟอร์มเพิ่ม/แก้วาระใน drawer ---------------------------------------
     รูปแบบเดียวกับแผนงาน: ช่องกว้าง มีป้ายกำกับครบ การ์ดในลิสต์ไม่กระโดด
     และกดยกเลิกตอนเพิ่มใหม่ = ไม่เหลือรายการเปล่าค้างในลิสต์ */
  var draftAsk = 'opinion';

  function openDiscDrawer(d, isNew) {
    var owners = SP.state.owners.filter(function (o) { return o.active; });
    function ownerOpts(cur) {
      return '<option value="">— ไม่ระบุ —</option>' +
        owners.map(function (o) {
          return '<option value="' + U.attr(o.name) + '"' + (o.name === cur ? ' selected' : '') + '>' +
                 U.esc(o.name) + '</option>';
        }).join('') +
        (cur && !U.ownerByName(cur) ? '<option value="' + U.attr(cur) + '" selected>' + U.esc(cur) + '</option>' : '');
    }

    var html =
      '<div class="field"><label>ประเภทของเรื่อง</label><div class="seg" id="df-ask">' +
        Object.keys(C.ASK_TYPES).map(function (k) {
          return '<button type="button" data-act="disc:ask" data-v="' + k + '" aria-pressed="' +
                 (d.askType === k) + '">' + U.esc(C.ASK_TYPES[k].th) + '</button>';
        }).join('') + '</div></div>' +
      '<div class="field"><label>หัวข้อที่จะเสนอที่ประชุม</label>' +
        '<textarea class="inp" id="df-topic" rows="2" placeholder="เช่น ขอบเขตเฟส 1 ของ RCM — ใช้ Rule-based ไม่รวม AI">' +
        U.esc(d.topic) + '</textarea></div>' +
      '<div class="field"><label>บริบท / ที่มา</label>' +
        '<textarea class="inp" id="df-context" rows="3" placeholder="ทำไมต้องเอาเข้าที่ประชุม เกิดอะไรขึ้นมาก่อน">' +
        U.esc(d.context) + '</textarea></div>' +
      '<div class="field"><label>ตัวเลือกที่มี (ถ้ามี)</label>' +
        '<textarea class="inp" id="df-options" rows="3" placeholder="1) …&#10;2) …&#10;3) …">' +
        U.esc(d.options) + '</textarea></div>' +
      '<div class="field-row">' +
        '<div class="field" style="flex:1 1 150px"><label>ผู้เสนอ</label>' +
          '<select class="inp" id="df-by">' + ownerOpts(d.proposedBy) + '</select></div>' +
        '<div class="field" style="flex:2 1 200px"><label>ผูกกับงาน</label>' +
          '<select class="inp" id="df-job"><option value="">— เรื่องทั่วไป (ไม่ผูกงาน) —</option>' +
          SP.state.jobs.map(function (x) {
            return '<option value="' + x.id + '"' + (x.id === d.jobId ? ' selected' : '') + '>' +
                   U.esc(x.customerName + ' — ' + (x.product || '')) + '</option>';
          }).join('') + '</select></div>' +
      '</div>' +
      '<div class="hr"></div>' +
      '<div class="small muted" style="margin-bottom:8px">' + U.ic('edit') +
        ' ช่องจดมติ — กรอกสด ๆ ระหว่างประชุม แล้วไฟล์ที่บันทึกออกไปคือรายงานการประชุม</div>' +
      '<div class="field"><label>มติ / ข้อสรุป</label>' +
        '<textarea class="inp" id="df-decision" rows="3">' + U.esc(d.decision) + '</textarea></div>' +
      '<div class="field-row">' +
        '<div class="field" style="flex:1 1 150px"><label>ผู้ตัดสิน</label>' +
          '<select class="inp" id="df-decidedby">' + ownerOpts(d.decidedBy) + '</select></div>' +
        '<div class="field" style="flex:1 1 150px"><label>สถานะ</label>' +
          '<select class="inp" id="df-status">' +
          U.opt(Object.keys(C.DISC_STATUS).map(function (k) { return [k, C.DISC_STATUS[k]]; }), d.status) +
          '</select></div>' +
      '</div>';

    SP.Drawer.open({
      title: isNew ? 'เพิ่มวาระประชุม' : 'แก้ไขวาระประชุม', icon: 'discuss', html: html,
      buttons: (isNew ? [] : [{ label:'ลบ', id:'del', cls:'btn btn-danger', icon:'trash' }])
        .concat([
          { label:'ยกเลิก', id:'no', cls:'btn' },
          { label: isNew ? 'เพิ่ม' : 'บันทึก', id:'save', cls:'btn btn-primary', icon:'check' }
        ]),
      onClick: function (id, root) {
        if (id === 'del') {
          SP.Store.remove('discussions', d.id);
          SP.Render.current();
          SP.Toast.show('ลบวาระแล้ว', 'ok');
          return;
        }
        if (id !== 'save') {
          if (isNew) SP.Store.remove('discussions', d.id);   // ยกเลิกตอนเพิ่ม = ไม่เหลือรายการเปล่า
          SP.Render.current();
          return;
        }
        var decision = root.querySelector('#df-decision').value.trim();
        SP.Store.patch('discussions', d.id, {
          askType:    draftAsk || d.askType,
          topic:      root.querySelector('#df-topic').value.trim(),
          context:    root.querySelector('#df-context').value.trim(),
          options:    root.querySelector('#df-options').value.trim(),
          proposedBy: root.querySelector('#df-by').value,
          jobId:      root.querySelector('#df-job').value || null,
          decision:   decision,
          decidedBy:  root.querySelector('#df-decidedby').value,
          status:     root.querySelector('#df-status').value,
          /* จดมติแล้วประทับเวลาให้เอง เลขาจะได้ไม่ต้องกรอกวันที่ */
          decidedAt:  decision ? (d.decidedAt || U.nowISO()) : null
        });
        SP.Render.current();
        SP.Toast.show(isNew ? 'เพิ่มวาระแล้ว' : 'บันทึกแล้ว', 'ok');
      }
    });
    draftAsk = d.askType;
  }

  function setDraftAsk(v) {
    draftAsk = v;
    var seg = SP.Drawer.el().querySelector('#df-ask');
    if (!seg) return;
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false');
    });
  }

  function render() {
    var open = SP.state.discussions.filter(function (d) { return d.status !== 'decided'; });
    var done = SP.state.discussions.filter(function (d) { return d.status === 'decided'; });
    return '<div class="sect-hd"><h2>' + U.ic('discuss', 'ic-lg') + 'เรื่องขอความเห็น / ขอมติจากที่ประชุม</h2>' +
        '<span class="sub">' + open.length + ' เรื่องรอสรุป</span><span class="spacer"></span>' +
        '<button class="btn btn-primary btn-sm" data-act="disc:add">' + U.ic('plus') + 'เพิ่มวาระ</button></div>' +
      (open.length
        ? '<div class="stack">' + open.map(card).join('') + '</div>'
        : '<div class="empty">ยังไม่มีวาระรอสรุป — กด “เพิ่มวาระ” หรือกดปุ่ม “ขอความเห็นเรื่องนี้” บนการ์ดงาน</div>') +
      (done.length
        ? '<details style="margin-top:16px"><summary class="muted" style="cursor:pointer">ตัดสินแล้ว (' + done.length + ')</summary>' +
          '<div class="stack" style="margin-top:10px">' + done.map(card).join('') + '</div></details>'
        : '');
  }
  return { render:render, card:card, openDiscDrawer:openDiscDrawer, setDraftAsk:setDraftAsk };
})();

function newDisc(jobId, context) {
  return SP.Store.add('discussions', {
    id: SP.U.uid('D'), seedBatch:'manual', jobId: jobId || null,

});

</script>

<script>
/* ============================================================================
   BLOCK 09 — VIEW: settings  (ผู้รับผิดชอบ · เอกสาร · ส่งต่อ · JSON · reset)
   อ้างอิงผู้รับผิดชอบด้วย "ชื่อ" ไม่ใช่ id เพราะคอลัมน์ผู้รับผิดชอบใน Excel
   มีแต่ชื่อ ถ้าใช้ id ต้องมีชั้น resolve ทุกครั้งที่ import และคนเปิดไฟล์ก็อ่านไม่ออก
   ทีมมี 4-5 คน ค่าใช้จ่ายของ cascade rename ต่ำกว่าชั้น id มาก
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Settings = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  // ---- นับการอ้างอิงถึงชื่อคนหนึ่ง ๆ ทั่วทั้งเอกสาร -----------------------
  function refs(name) {
    var r = { jobs:[], plans:[], discussions:[] };
    SP.state.jobs.forEach(function (j) { if (U.normNames(j.assignedTo).indexOf(name) >= 0) r.jobs.push(j); });
    SP.state.plans.forEach(function (p) { if (p.owner === name) r.plans.push(p); });
    SP.state.discussions.forEach(function (d) {
      if (d.proposedBy === name || d.decidedBy === name) r.discussions.push(d);
    });
    r.total = r.jobs.length + r.plans.length + r.discussions.length;
    return r;
  }
  function renameEverywhere(from, to) {
    SP.state.jobs.forEach(function (j) {
      j.assignedTo = U.normNames(j.assignedTo).map(function (n) { return n === from ? to : n; });
    });
    SP.state.plans.forEach(function (p) { if (p.owner === from) p.owner = to; });
    SP.state.discussions.forEach(function (d) {
      if (d.proposedBy === from) d.proposedBy = to;
      if (d.decidedBy === from) d.decidedBy = to;
    });
    if (SP.state.settings.defaultOwner === from) SP.state.settings.defaultOwner = to;
    if (SP.ui.me === from) { SP.ui.me = to; SP.Store.saveUI(); }
  }
  /* ชื่อที่โผล่ในข้อมูลแต่ยังไม่อยู่ในรายชื่อ — จำเป็นหลัง import ไฟล์ที่มี
     คอลัมน์ผู้รับผิดชอบ ไม่งั้นชื่อจากชีตจะกลายเป็นชื่อกำพร้าที่ dropdown ไม่รู้จัก */
  function orphanNames() {
    var known = {}, found = {};
    SP.state.owners.forEach(function (o) { known[o.name] = 1; });
    function note(n) { if (n && !known[n]) found[n] = (found[n] || 0) + 1; }
    SP.state.jobs.forEach(function (j) { U.normNames(j.assignedTo).forEach(note); });
    SP.state.plans.forEach(function (p) { note(p.owner); });
    SP.state.discussions.forEach(function (d) { note(d.proposedBy); note(d.decidedBy); });
    return Object.keys(found).map(function (n) { return { name:n, count:found[n] }; });
  }
  function nextColor() {
    var used = {};
    SP.state.owners.forEach(function (o) { used[String(o.color).toUpperCase()] = 1; });
    for (var i = 0; i < C.OWNER_PALETTE.length; i++) {
      if (!used[C.OWNER_PALETTE[i].toUpperCase()]) return C.OWNER_PALETTE[i];
    }
    return C.OWNER_PALETTE[SP.state.owners.length % C.OWNER_PALETTE.length];
  }
  function addOwner(name) {
    var o = {
      id: U.uid('O'), name: name || 'ผู้รับผิดชอบใหม่', short:'', color: nextColor(),
      role:'sale', active:true, order: SP.state.owners.length + 1
    };
    SP.Store.add('owners', o);
    return o;
  }

  // ---- render -------------------------------------------------------------
  function ownerRow(o, i, n) {
    var r = refs(o.name);
    return '<tr>' +
      '<td class="nowrap">' +
        '<button class="btn btn-icon btn-ghost muted" data-act="owner:move" data-id="' + o.id + '" data-dir="-1" ' +
          (i === 0 ? 'disabled ' : '') + 'title="เลื่อนขึ้น" aria-label="เลื่อนขึ้น">' + U.ic('chevron-up') + '</button>' +
        '<button class="btn btn-icon btn-ghost muted" data-act="owner:move" data-id="' + o.id + '" data-dir="1" ' +
          (i === n - 1 ? 'disabled ' : '') + 'title="เลื่อนลง" aria-label="เลื่อนลง">' + U.ic('chevron-down') + '</button>' +
      '</td>' +
      '<td><span class="avatar avatar-lg" style="background:' + U.attr(o.color) + '">' + U.esc(U.initials(o.short || o.name)) + '</span></td>' +
      '<td><input class="inp" style="min-width:120px" value="' + U.attr(o.name) + '" data-act-input="owner:name" data-id="' + o.id + '" aria-label="ชื่อผู้รับผิดชอบ"></td>' +
      '<td><input class="inp" style="max-width:90px" value="' + U.attr(o.short) + '" placeholder="ย่อ" data-field="owners:' + o.id + ':short" aria-label="ชื่อย่อ"></td>' +
      '<td><div class="center" style="flex-wrap:wrap;gap:3px">' +
        C.OWNER_PALETTE.map(function (c) {
          return '<button class="btn btn-icon" data-act="owner:color" data-id="' + o.id + '" data-c="' + c + '" ' +
                 'style="background:' + c + ';border-color:' + (String(o.color).toUpperCase() === c.toUpperCase() ? 'var(--g900)' : 'transparent') +
                 ';width:18px;height:18px;padding:0" title="' + c + '" aria-label="เลือกสี ' + c + '"></button>';
        }).join('') +
      '</div></td>' +
      '<td><select class="inp" style="max-width:120px" data-field="owners:' + o.id + ':role">' +
        U.opt(Object.keys(C.OWNER_ROLES).map(function (k) { return [k, C.OWNER_ROLES[k]]; }), o.role) + '</select></td>' +
      '<td><label class="check"><input type="checkbox" data-field="owners:' + o.id + ':active"' + (o.active ? ' checked' : '') + '>ใช้งาน</label></td>' +
      '<td class="tiny muted nowrap">' + (r.total ? r.jobs.length + ' งาน · ' + r.plans.length + ' แผน · ' + r.discussions.length + ' วาระ' : 'ยังไม่มีงาน') + '</td>' +
      '<td><button class="btn btn-icon btn-danger" data-act="owner:del" data-id="' + o.id + '" title="ลบ" aria-label="ลบผู้รับผิดชอบ">' + U.ic('trash') + '</button></td>' +
    '</tr>';
  }

  function ownersCard() {
    var list = SP.state.owners.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    var orphans = orphanNames();
    return '<section class="sect"><div class="sect-hd"><h2>' + U.ic('users', 'ic-lg') + 'ผู้รับผิดชอบ</h2>' +
        '<span class="sub">' + list.length + ' คน · ชื่อที่แก้ตรงนี้จะเปลี่ยนตามไปทุกที่ที่อ้างถึง</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm" data-act="owner:scan">' + U.ic('refresh') + 'ดึงชื่อจากข้อมูลที่มี' +
          (orphans.length ? ' (' + orphans.length + ')' : '') + '</button>' +
        '<button class="btn btn-primary btn-sm" data-act="owner:add">' + U.ic('plus') + 'เพิ่มผู้รับผิดชอบ</button>' +
      '</div>' +
      (orphans.length
        ? '<div class="banner banner-warn">' + U.ic('alert') +
          '<div><b>พบชื่อในข้อมูล ' + orphans.length + ' ชื่อ ที่ยังไม่อยู่ในรายชื่อ:</b> ' +
          orphans.map(function (o) { return U.esc(o.name) + ' (' + o.count + ')'; }).join(' · ') +
          '<br><span class="small">กด “ดึงชื่อจากข้อมูลที่มี” เพื่อเพิ่มทั้งหมด</span></div></div>'

  function docCard() {

        '<div class="hint">' + U.ic('print') + ' ปุ่ม “พิมพ์ / PDF” ด้านบนจะพิมพ์เฉพาะแท็บสรุปประจำสัปดาห์ ' + 'โดยซ่อนปุ่ม ตัวแก้ไข และข้อมูลวงในให้อัตโนมัติ</div>' +

  function render() { return ownersCard() + docCard() + handoffCard() + dangerCard(); }

  return { render:render, refs:refs, renameEverywhere:renameEverywhere, orphanNames:orphanNames, addOwner:addOwner };
})();

/* ---- owner actions ------------------------------------------------------- */
SP.Actions.on('owner:add', function () {
  var o = SP.Settings.addOwner('');
  SP.Render.current();
  setTimeout(function () {
    var el = document.querySelector('[data-act-input="owner:name"][data-id="' + o.id + '"]');
    if (el) { el.focus(); el.select(); }
  }, 40);
});
SP.Actions.on('owner:color', function (ds) {
  SP.Store.patch('owners', ds.id, { color: ds.c });
  SP.Render.current();
});
SP.Actions.on('owner:move', function (ds) {
  var list = SP.state.owners.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  var i = list.findIndex(function (o) { return o.id === ds.id; });
  var k = i + Number(ds.dir);
  if (i < 0 || k < 0 || k >= list.length) return;
  var t = list[i]; list[i] = list[k]; list[k] = t;
  list.forEach(function (o, n) { o.order = n + 1; });
  SP.Store.touch();
  SP.Render.current();
});
/* ลบต้องตรวจก่อนเสมอ — ห้ามลบเงียบ ๆ จนเหลือชื่อกำพร้า */
SP.Actions.on('owner:del', function (ds) {
  var o = SP.U.byId(SP.state.owners, ds.id); if (!o) return;
  var r = SP.Settings.refs(o.name);
  if (!r.total) {
    SP.Store.remove('owners', o.id);
    SP.Render.current();
    SP.Toast.show('ลบ ' + o.name + ' แล้ว', 'ok');
    return;
  }
  var others = SP.state.owners.filter(function (x) { return x.id !== o.id; });
  SP.Modal.open({
    title:'ลบ ' + o.name + '?', icon:'alert',
    html:'<p><b>' + SP.U.esc(o.name) + '</b> ถูกอ้างถึงอยู่ใน <b>' + r.jobs.length + ' งาน · ' +
         r.plans.length + ' แผนงาน · ' + r.discussions.length + ' วาระ</b></p>' +
         '<div class="field"><label>ย้ายงานทั้งหมดไปที่</label><select class="inp" id="sp-reassign">' +
         '<option value="">— ปล่อยว่าง (ไม่มีผู้รับผิดชอบ) —</option>' +
         others.map(function (x) { return '<option value="' + SP.U.attr(x.name) + '">' + SP.U.esc(x.name) + '</option>'; }).join('') +
         '</select></div>',
    buttons: [{ label:'ยกเลิก', id:'no' }, { label:'ลบและย้ายงาน', id:'yes', cls:'btn btn-danger' }],
    onClick: function (id, root) {
      if (id !== 'yes') return;
      var to = root.querySelector('#sp-reassign').value;
      if (to) SP.Settings.renameEverywhere(o.name, to);
      else {
        SP.state.jobs.forEach(function (j) {
          j.assignedTo = SP.U.normNames(j.assignedTo).filter(function (n) { return n !== o.name; });
        });
        SP.state.plans.forEach(function (p) { if (p.owner === o.name) p.owner = ''; });
        SP.state.discussions.forEach(function (d) {
          if (d.proposedBy === o.name) d.proposedBy = '';
          if (d.decidedBy === o.name) d.decidedBy = '';
        });
      }
      SP.Store.remove('owners', o.id);
      SP.Render.current();
      SP.Toast.show(to ? ('ลบแล้ว — ย้ายงานไปที่ ' + to) : 'ลบแล้ว — งานที่เกี่ยวข้องไม่มีผู้รับผิดชอบ', 'ok');
    }
  });
});
SP.Actions.on('owner:scan', function () {

  if (!list.length) { SP.Toast.show('ไม่พบชื่อใหม่ในข้อมูล', 'warn'); return; }

/* ล็อกไฟล์ใหม่ — ลบสถานะปลดล็อกของเครื่องนี้ แล้วโหลดหน้าใหม่ให้ประตู PIN ขึ้นอีกครั้ง */

          '<p class="muted small">ข้อมูลไม่หาย — เป็นแค่การล้างสถานะปลดล็อกของเครื่อง</p>'
  }, function () {
