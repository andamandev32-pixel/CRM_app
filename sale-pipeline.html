    if (isWon(stageId)) return Math.round(value || 0);
    if (isLost(stageId) || isParked(stageId)) return 0;
    var s = stage(stageId), b = BUDGET_CODES[budgetCode || 'Level 4'];
    if (!s || !b) return 0;
    return Math.round((value || 0) * (s.probability / 100) * b.weight);
  }

  /* ค่าที่แสดงจริง: ถ้า job.expectedRevenue เป็นตัวเลข = ผู้ใช้ override เอง */
  function jobExpected(j) {
    if (j && typeof j.expectedRevenue === 'number') return j.expectedRevenue;
    return expectedRevenue(j ? j.value : 0, j ? j.stage : 'S0', j ? j.budgetCode : 'Level 4');
  }

  return {
    STAGES:STAGES, STAGE_COLORS:STAGE_COLORS, STAGE_MIGRATION:STAGE_MIGRATION,
    BUDGET_CODES:BUDGET_CODES, PRODUCT_GROUPS:PRODUCT_GROUPS, CUSTOMER_GROUPS:CUSTOMER_GROUPS,
    WORK_STATUS:WORK_STATUS, NEEDS_REASON:NEEDS_REASON, WAITING_ON:WAITING_ON,
    ASK_TYPES:ASK_TYPES, DISC_STATUS:DISC_STATUS, BUCKETS:BUCKETS, INTERESTS:INTERESTS,
    OWNER_ROLES:OWNER_ROLES, OWNER_PALETTE:OWNER_PALETTE,
    BUDGET_YEARS:BUDGET_YEARS, TABS:TABS,
    STORAGE_PREFIX:STORAGE_PREFIX, XLSX_CDN:XLSX_CDN,
    stage:stage, budget:budget, group:group,
    isWon:isWon, isLost:isLost, isParked:isParked, isClosed:isClosed, migrateStage:migrateStage,
    expectedRevenue:expectedRevenue, jobExpected:jobExpected
  };
})();
</script>

<script>
/* ============================================================================
   BLOCK 02 — UTIL (escape, icons, Thai dates, currency, fiscal week, badges)
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.U = (function () {
  'use strict';
  var C = SP.C;

  /* --- escape ทุกค่าที่ interpolate เข้า innerHTML — ห้ามลืมแม้แต่ที่เดียว ---
     pipeline.js ของแอปหลักยัด opp.remark เข้า innerHTML ตรง ๆ ที่นี่จะไม่ทำแบบนั้น */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
    });
  }
  function attr(s) { return esc(s); }

  /* --- ไอคอน: อ้าง <symbol> ใน sprite เดียวกัน ไม่มีไฟล์ภายนอก (file:// fetch ไม่ได้) */
  function ic(name, cls) {
    return '<svg class="ic ' + (cls || '') + '" aria-hidden="true"><use href="#ic-' + name + '"/></svg>';
  }

  // ---- Thai dates (js/utils.js:5-41) — พ.ศ. = ค.ศ. + 543 ------------------
  var TH_MON  = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var TH_MONF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  function toDate(v) {
    if (!v) return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
    var d = new Date(v);
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtDate(v, mode) {
    var d = toDate(v); if (!d) return '—';
    var be = d.getFullYear() + 543;
    if (mode === 'full')  return d.getDate() + ' ' + TH_MONF[d.getMonth()] + ' ' + be;
    if (mode === 'short') return d.getDate() + '/' + (d.getMonth() + 1) + '/' + be;
    if (mode === 'datetime') {
      return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + be + ' ' +
             pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + be;
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  function money(n) {
    n = Number(n) || 0;
    try {
      return new Intl.NumberFormat('th-TH', {
        style:'currency', currency:'THB', minimumFractionDigits:0, maximumFractionDigits:0
      }).format(n);
    } catch (e) { return '฿' + n.toLocaleString(); }
  }
  /* ย่อให้อ่านบนสไลด์ได้: 12,000,000 -> 12.0 ล้าน */
  function moneyShort(n) {
    n = Number(n) || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + ' ล้าน';
    if (n >= 1e3) return Math.round(n / 1e3) + 'K';
    return String(n);
  }
  /* งานที่ยังไม่รู้ราคา ต้องไม่แสดงเป็น ฿0 เพราะจะทำให้ยอดรวมบนสไลด์เข้าใจผิด */
  function moneyOrPending(n) {
    return (Number(n) || 0) > 0
      ? '<span class="val mono">' + esc(money(n)) + '</span>'
      : '<span class="val-pending">รอประเมินราคา</span>';
  }

  // ---- เลขสัปดาห์ (ปีปฏิทิน แบบ ISO 8601 · สัปดาห์เริ่มวันจันทร์) -----------
  function monday(d) {
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  /* เลขสัปดาห์นับตาม "ปีปฏิทิน" แบบ ISO 8601 (เหมือน ISOWEEKNUM ใน Excel)
     - สัปดาห์เริ่มวันจันทร์
     - สัปดาห์เป็นของปีไหน ดูจาก "วันพฤหัสของสัปดาห์นั้น" จึงไม่มีสัปดาห์ไหน
       ถูกนับซ้ำหรือหายไปตอนข้ามปี และทุกวันในสัปดาห์เดียวกันได้ป้ายเดียวกันเสมอ
     หมายเหตุ: ปีงบประมาณยังใช้อยู่ ที่ฟิลด์ budgetYear ของแต่ละงาน — คนละเรื่องกัน */
  function weekAnchor(d) {
    var t = monday(d);
    return new Date(t.getFullYear(), t.getMonth(), t.getDate() + 3);   // วันพฤหัส
  }
  function yearTH(d) { return weekAnchor(d).getFullYear() + 543; }
  function weekNo(d) {
    var a = weekAnchor(d);
    var jan1 = new Date(a.getFullYear(), 0, 1);
    return Math.floor(Math.round((a - jan1) / 86400000) / 7) + 1;
  }

  /* ป้ายหัวเรื่อง: "สัปดาห์ที่ 37 · ปี 2569 · 7–13 ก.ย. 2569" */
  function weekLabel(iso) {
    var d = toDate(iso + 'T00:00:00') || new Date();
    var a = monday(d), b = new Date(a); b.setDate(b.getDate() + 6);
    var be = a.getFullYear() + 543;
    var span = (a.getMonth() === b.getMonth())
      ? a.getDate() + '–' + b.getDate() + ' ' + TH_MON[a.getMonth()] + ' ' + be
      : a.getDate() + ' ' + TH_MON[a.getMonth()] + ' – ' + b.getDate() + ' ' + TH_MON[b.getMonth()] + ' ' + (b.getFullYear() + 543);
    return 'สัปดาห์ที่ ' + weekNo(d) + ' · ปี ' + yearTH(d) + ' · ' + span;
  }
  function isoDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function daysSince(v) {
    var d = toDate(v); if (!d) return null;
    return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
  }
  function nowISO() { return new Date().toISOString(); }
  function uid(prefix) { return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }


  /* ---- Trial: นับวันของขั้น S2 (รอสาธิต) และ S3 (กำลังสาธิต) --------------
     คืนก้อนเดียวให้ทั้งการ์ด ส่วนสรุป และหัวข้อเดดไลน์ใช้ร่วมกัน
     จะได้ไม่ต้องคำนวณซ้ำ 3 ที่แล้วเพี้ยนคนละแบบ
     mode: none | waiting | scheduled | running | overdue | done */
  function dayDiff(a, b) {
    var x = toDate(a), y = toDate(b);
    if (!x || !y) return null;
    var ax = new Date(x.getFullYear(), x.getMonth(), x.getDate());
    var by = new Date(y.getFullYear(), y.getMonth(), y.getDate());
    return Math.round((by - ax) / 86400000);
  }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  function trialInfo(j) {
    var st = SP.C.stage(j.stage);
    var kind = st && st.trial;
    if (!kind) return { mode:'none' };

    if (kind === 'waiting') {
      var waited = j.trialRequestedAt ? dayDiff(j.trialRequestedAt, today()) : null;
      if (j.trialPlannedDate) {
        var inDays = dayDiff(today(), j.trialPlannedDate);
        return { mode:'scheduled', waited:waited, inDays:inDays, date:j.trialPlannedDate,
                 warn: inDays !== null && inDays < 0 };
      }
      return { mode:'waiting', waited:waited, warn: waited !== null && waited > 14 };
    }

    // kind === 'running'
    if (!j.trialStart) return { mode:'running', day:null, total:null, left:null, warn:false };
    var day = dayDiff(j.trialStart, today()) + 1;
    var total = j.trialEnd ? dayDiff(j.trialStart, j.trialEnd) + 1 : null;
    var left = j.trialEnd ? dayDiff(today(), j.trialEnd) : null;
    if (left !== null && left < 0) return { mode:'overdue', day:day, total:total, over:-left, warn:true };
    return { mode:'running', day:day, total:total, left:left, warn: left !== null && left <= 7 };
  }

  /* ข้อความสั้นสำหรับติดบนการ์ด */
  function trialText(j) {
    var t = trialInfo(j);
    if (t.mode === 'none') return '';
    if (t.mode === 'waiting') {
      return (t.waited === null ? 'รอสาธิต' : 'รอสาธิตมาแล้ว ' + t.waited + ' วัน') + ' · ยังไม่กำหนดวันสาธิต';
    }
    if (t.mode === 'scheduled') {
      return 'นัดสาธิต ' + fmtDate(t.date) +
             (t.inDays === null ? '' : (t.inDays >= 0 ? ' (อีก ' + t.inDays + ' วัน)' : ' (เลยมา ' + (-t.inDays) + ' วัน)'));
    }
    if (t.mode === 'overdue') return 'Trial ครบกำหนดแล้ว ' + t.over + ' วัน — ต้องสรุปผล';
    if (t.day === null) return 'Trial กำลังดำเนินอยู่ (ยังไม่ระบุวันเริ่ม)';
    return 'Trial วันที่ ' + t.day + (t.total ? ' จาก ' + t.total : '') +
           (t.left === null ? '' : ' · เหลืออีก ' + t.left + ' วัน');
  }


  /* ---- ส่งมอบ / การชำระเงิน (ขั้น S8) --------------------------------------
     ส่งมอบแล้วไม่ได้แปลว่าจบ -- เงินยังไม่เข้าก็ยังเป็นงานค้างที่ต้องตาม
     คืนก้อนเดียวให้การ์ด ฟอร์ม และหัวข้อเดดไลน์ใช้ร่วมกัน จะได้ไม่คำนวณซ้ำ 3 ที่ */
  function deliveryInfo(j) {
    var st = SP.C.stage(j.stage);
    if (!st || !st.delivered) return { mode:'none', since:null, lag:null, warn:false };
    if (!j.deliveredAt)       return { mode:'nodate', since:null, lag:null, warn:true };
    var since = dayDiff(j.deliveredAt, today());
    if (j.paid) {
      return { mode:'paid', since:since, warn:false,
               lag: j.paidAt ? dayDiff(j.deliveredAt, j.paidAt) : null };
    }
    return { mode:'unpaid', since:since, lag:null, warn: since !== null && since > 30 };
  }

  function deliveryText(j) {
    var d = deliveryInfo(j);
    if (d.mode === 'none') return '';
    if (d.mode === 'nodate') return 'ส่งมอบแล้ว — ยังไม่ได้ระบุวันที่ส่งมอบ';
    var head = 'ส่งมอบ ' + fmtDate(j.deliveredAt) +
               (d.since !== null && d.since > 0 ? ' (' + d.since + ' วันก่อน)' : '');
    if (d.mode === 'paid') {
      return head + ' · ชำระแล้ว' + (j.paidAt ? ' ' + fmtDate(j.paidAt) : ' (ยังไม่ระบุวันที่)') +
             (d.lag !== null ? ' — ใช้เวลา ' + d.lag + ' วัน' : '');
    }
    return head + ' · ยังไม่ได้รับชำระ';
  }


  /* ---- พักงาน / ไม่ได้ทำต่อ (ขั้น S10) -------------------------------------
     แยก 2 กรณีที่ผู้ใช้พูดถึงด้วยฟิลด์เดียว: มี reviveOn = นัดกลับมาทบทวนแล้ว
     ไม่มี = "รอไม่มีกำหนด" ซึ่งเป็นกรณีที่หายเงียบได้ง่ายที่สุด จึงต้องมีตัวนับวันคุม */
  function parkInfo(j) {
    var st = SP.C.stage(j.stage);
    if (!st || !st.isParked) return { mode:'none', since:null, reviveIn:null, warn:false };
    if (!j.parkedAt)         return { mode:'nodate', since:null, reviveIn:null, warn:true };
    var since = dayDiff(j.parkedAt, today());
    if (j.reviveOn) {
      var rv = dayDiff(today(), j.reviveOn);
      return { mode:'dated', since:since, reviveIn:rv, warn: rv !== null && rv <= 0 };
    }
    /* พักไว้เกิน 90 วันโดยไม่มีกำหนดกลับมา = ต้องตัดสินใจแล้วว่าจะรื้อฟื้นหรือปิดเป็น S9 */
    return { mode:'open', since:since, reviveIn:null, warn: since !== null && since > 90 };
  }

  function parkText(j) {
    var p = parkInfo(j);
    if (p.mode === 'none') return '';
    if (p.mode === 'nodate') return 'พักไว้ — ยังไม่ได้ระบุวันที่เริ่มพัก';
    var head = 'พักไว้ตั้งแต่ ' + fmtDate(j.parkedAt) +
               (p.since !== null && p.since > 0 ? ' (' + p.since + ' วัน)' : '');
    if (p.mode === 'open') return head + ' · ยังไม่มีกำหนดกลับมาทำ';
    if (p.reviveIn === null) return head;
    return head + (p.reviveIn >= 0
      ? ' · นัดทบทวน ' + fmtDate(j.reviveOn) + ' (อีก ' + p.reviveIn + ' วัน)'
      : ' · เลยวันนัดทบทวนมา ' + (-p.reviveIn) + ' วัน');
  }

  // ---- badges ------------------------------------------------------------
  function stageBadge(id) {
    var s = C.stage(id); if (!s) return '';
    var col = C.STAGE_COLORS[id] || '#98A2B3';
    return '<span class="badge badge-stage" style="background:' + col + '" title="' +
           attr(s.name + ' — ' + s.nameTH) + '">' + esc(s.id.replace('_WON', '')) + ' · ' + esc(s.nameTH) + '</span>';
  }
  function stageDot(id) {
    return '<span class="bcol-dot" style="background:' + (C.STAGE_COLORS[id] || '#98A2B3') + '"></span>';
  }
  function groupBadge(id) {
    var g = C.group(id);
    return '<span class="badge badge-outline" style="color:' + g.color + '" title="' + attr(g.name) + '">' +
           ic(g.icon) + esc(g.nameTH) + '</span>';
  }
  function levelBadge(code) {
    var b = C.budget(code);
    return '<span class="badge badge-outline" style="color:' + b.color + '" title="' + attr(b.nameTH) + '">' +
           ic(b.icon) + esc(code || 'Level 4') + '</span>';
  }
  function statusBadge(st) {
    var w = C.WORK_STATUS[st] || C.WORK_STATUS.active;
    if (st === 'active') return '';
    return '<span class="badge badge-outline" style="color:' + w.color + '">' + ic(w.icon) + esc(w.th) + '</span>';
  }

  // ---- owners ------------------------------------------------------------
  function ownerByName(name) {
    var list = (SP.state && SP.state.owners) || [];
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return null;
  }
  function initials(name) {
    var s = String(name || '').replace(/^(พี่|คุณ|น้อง)/, '').trim();
    return s.slice(0, 2) || '?';
  }
  function ownerChip(name, opts) {
    opts = opts || {};
    if (!name) return '';
    var o = ownerByName(name);
    var color = o ? o.color : '#98A2B3';
    var cls = o ? 'chip' : 'chip chip-unknown';
    var warn = o ? '' : ic('alert');
    var av = o ? '<span class="avatar" style="background:' + color + '">' + esc(initials(o.short || o.name)) + '</span>' : '';
    return '<span class="' + cls + '" title="' + attr(o ? (C.OWNER_ROLES[o.role] || '') : 'ยังไม่อยู่ในรายชื่อผู้รับผิดชอบ') + '">' +
           av + warn + esc(name) +
           (!o && opts.addBtn ? ' <button class="btn btn-xs" data-act="owner:quickadd" data-name="' + attr(name) + '">เพิ่มเข้ารายชื่อ</button>' : '') +
           '</span>';
  }
  function ownersChips(arr, opts) {
    arr = normNames(arr);
    if (!arr.length) return '<span class="muted small">ยังไม่ระบุผู้รับผิดชอบ</span>';
    return arr.map(function (n) { return ownerChip(n, opts); }).join(' ');
  }
  /* รองรับทั้ง array และ string เก่า (แอปหลักเก็บเป็น "พี่มายด์, พี่โอ๋") */
  function normNames(v) {
    if (Array.isArray(v)) return v.map(function (s) { return String(s).trim(); }).filter(Boolean);
    if (typeof v === 'string') return v.split(/[,/]|และ/).map(function (s) { return s.trim(); }).filter(Boolean);
    return [];
  }

  // ---- misc --------------------------------------------------------------
  function opt(list, cur, blank) {
    var out = blank ? '<option value="">' + esc(blank) + '</option>' : '';
    list.forEach(function (o) {
      var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o;
      out += '<option value="' + attr(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>';
    });
    return out;
  }
  function budgetYearOptions(cur) {
    var out = '<option value="">— เลือกปี —</option>';
    C.BUDGET_YEARS.forEach(function (g) {
      out += '<option disabled>' + esc('— ' + g.label + ' —') + '</option>';
      g.years.forEach(function (y) {
        out += '<option value="' + attr(y[0]) + '"' + (y[0] === cur ? ' selected' : '') + '>' + esc(y[1]) + '</option>';
      });
    });
    return out;
  }
  function sum(arr, fn) { return arr.reduce(function (a, x) { return a + (Number(fn(x)) || 0); }, 0); }
  function byId(arr, id) { for (var i=0;i<arr.length;i++) if (arr[i].id === id) return arr[i]; return null; }
  function pluralTH(n, w) { return n.toLocaleString() + ' ' + w; }
  function truthy(v) { return !!v; }
  function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }

  return {
    esc:esc, attr:attr, ic:ic, nl2br:nl2br,
    TH_MON:TH_MON, TH_MONF:TH_MONF, toDate:toDate, fmtDate:fmtDate, pad:pad,
    money:money, moneyShort:moneyShort, moneyOrPending:moneyOrPending,
    monday:monday, yearTH:yearTH, weekNo:weekNo, weekAnchor:weekAnchor, weekLabel:weekLabel,
    isoDate:isoDate, daysSince:daysSince, nowISO:nowISO, uid:uid,
    dayDiff:dayDiff, today:today, trialInfo:trialInfo, trialText:trialText,
    deliveryInfo:deliveryInfo, deliveryText:deliveryText,
    parkInfo:parkInfo, parkText:parkText,
    stageBadge:stageBadge, stageDot:stageDot, groupBadge:groupBadge,
    levelBadge:levelBadge, statusBadge:statusBadge,
    ownerByName:ownerByName, ownerChip:ownerChip, ownersChips:ownersChips,
    initials:initials, normNames:normNames,
    opt:opt, budgetYearOptions:budgetYearOptions, sum:sum, byId:byId,
    pluralTH:pluralTH, truthy:truthy
  };
})();
</script>

<script>
/* ============================================================================
   BLOCK 03 — STORE
   localStorage บน file:// : Chrome/Edge ตี origin เป็น "file://" เฉย ๆ ไม่มี path
   => ไฟล์ HTML ทุกไฟล์ในเครื่องใช้ bucket เดียวกัน จึงต้อง scope key ด้วย docId
   ถ้า localStorage ใช้ไม่ได้เลย (โควตาเต็ม / Safari SecurityError) แอปยังทำงาน
   ครบทุกอย่างในหน่วยความจำ + แบนเนอร์แดงเตือนให้กดบันทึกเป็นไฟล์ก่อนปิด
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Store = (function () {
  'use strict';
  var P = SP.C.STORAGE_PREFIX;
  var saveTimer = null;
  var saveMode = 'ok';          // ok | memory

  function stateKey(docId) { return P + 'state__' + docId; }
  function undoKey(docId)  { return P + 'undo__' + docId; }
  var UI_KEY    = P + 'ui';
  var INDEX_KEY = P + 'index';

  function lsGet(k) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { return false; }
  }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // ---- machine-local UI prefs (ไม่เดินทางไปกับไฟล์) -----------------------
  var ui = { me:'', activeTab:'week', filters:{}, filtersOpen:false, folded:{}, openJobs:{}, unlocked:false };
  function loadUI() {
    var u = lsGet(UI_KEY);
    if (u && typeof u === 'object') {
      ui.me = u.me || '';
      ui.activeTab = u.activeTab || 'week';
      /* ตัวกรองเปลี่ยนจากค่าเดี่ยวเป็นเลือกได้หลายค่า — แปลงของเก่าให้ */
      ui.filters = u.filters || {};
      Object.keys(ui.filters).forEach(function (k) {
        var v = ui.filters[k];
        if (k === 'text') { ui.filters[k] = typeof v === 'string' ? v : ''; return; }
        if (Array.isArray(v)) return;
        ui.filters[k] = v ? [v] : [];
      });
      ui.filtersOpen = !!u.filtersOpen;
      ui.folded = u.folded || {};
      ui.openJobs = u.openJobs || {};
      ui.unlocked = !!u.unlocked;
    }
    SP.ui = ui;
    return ui;
  }
  function saveUI() { lsSet(UI_KEY, ui); }

  // ---- migrate ------------------------------------------------------------
  /* เขียนตั้งแต่วันแรกแม้มี case เดียว — สัปดาห์ที่สองคือตอนที่จะต้องใช้ */
  function migrate(doc) {
    if (!doc || typeof doc !== 'object') return doc;
    var s = Number(doc.schema) || 0;

    if (s < 1) {
      doc.schema = 1;
      var m = doc.meta = doc.meta || {};
      if (typeof m.revision !== 'number') m.revision = 1;
      if (!('savedAt' in m))  m.savedAt = null;
      if (!('savedBy' in m))  m.savedBy = '';
      if (!('handoffTo' in m)) m.handoffTo = '';
      if (typeof m.editsSinceSave !== 'number') m.editsSinceSave = 0;
      if (!Array.isArray(m.lineage)) m.lineage = [];
      /* เปลี่ยนจากนับสัปดาห์ตามปีงบ -> ตามปีปฏิทิน: ย้ายชื่อฟิลด์ให้เอกสารเก่า */
      if (m.yearTH === undefined) m.yearTH = m.fiscalYearTH;
      if (m.weekNo === undefined) m.weekNo = m.fiscalWeek;
      delete m.fiscalYearTH; delete m.fiscalWeek;
      if (!Array.isArray(doc.owners)) doc.owners = [];
      if (!Array.isArray(doc.plans)) doc.plans = [];
      if (!Array.isArray(doc.discussions)) doc.discussions = [];
      doc.settings = doc.settings || { defaultOwner:'' };
    }

    /* schema 2 — โครงขั้นการขายเปลี่ยนจาก S0–S9 เป็น S0–S8
       ต้องแปลงทั้ง job.stage และทุก entry ใน stageHistory (ทั้ง stage และ from)
       ไม่งั้นส่วน "ความคืบหน้า" จะอ่านรหัสขั้นที่ไม่มีอยู่แล้วและเงียบหาย */
    if (s < 2) {
      doc.schema = 2;
      (doc.jobs || []).forEach(function (j) {
        j.stage = SP.C.migrateStage(j.stage);
        if (Array.isArray(j.stageHistory)) {
          j.stageHistory.forEach(function (h) {
            if (h.stage) h.stage = SP.C.migrateStage(h.stage);
            if (h.from) h.from = SP.C.migrateStage(h.from);
          });
        }
      });
      /* showValuesInPresent ใช้กับโหมดนำเสนอที่ถูกถอดออกแล้ว */
      if (doc.settings) delete doc.settings.showValuesInPresent;
    }

    /* schema 3 -- แทรกขั้น "ส่งมอบแล้ว" เป็น S8 ทำให้ "ไม่สำเร็จ" ขยับไป S9
       เอกสาร schema 2 ต้องย้ายเอง ใช้ migrateStage() ไม่ได้ เพราะตารางนั้นแปลง
       "รหัสชุดเดิมของสเปรดชีต" ไม่ใช่รหัสชุด schema 2 -- ถ้าเผลอใช้ งานที่แพ้
       จะกลายเป็นงานที่ส่งมอบแล้ว ซึ่งพลิกความหมายกลับด้าน */
    if (s === 2) {
      (doc.jobs || []).forEach(function (j) {
        if (j.stage === 'S8') j.stage = 'S9';
        if (Array.isArray(j.stageHistory)) {
          j.stageHistory.forEach(function (h) {
            if (h.stage === 'S8') h.stage = 'S9';
            if (h.from  === 'S8') h.from  = 'S9';
          });
        }
      });
    }
    if (s < 3) doc.schema = 3;

    // ให้ทุก job มีรูปร่างเดียวกันเสมอ ไม่ว่าจะมาจาก seed, import หรือไฟล์รุ่นเก่า
    (doc.jobs || []).forEach(function (j) {
      if (typeof j.stageHistory === 'string') {
        try { j.stageHistory = JSON.parse(j.stageHistory); } catch (e) { j.stageHistory = []; }
      }
      if (!Array.isArray(j.stageHistory)) j.stageHistory = [];
      j.assignedTo = SP.U.normNames(j.assignedTo);
      if (!Array.isArray(j.contacts))  j.contacts = [];
      if (!Array.isArray(j.relatedTo)) j.relatedTo = [];
      ['incumbent','intel','egpProjectId','weekNote','blockReason','waitingFor','waitingOn',
       'detail','remark','salesStatus','province','sectionLabel','product',
       'parkReason'].forEach(function (k) {
        if (typeof j[k] !== 'string') j[k] = j[k] == null ? '' : String(j[k]);
      });
      if (!j.workStatus) j.workStatus = 'active';
      if (typeof j.presentVisible !== 'boolean') j.presentVisible = true;
      if (typeof j.isNewThisWeek !== 'boolean') j.isNewThisWeek = false;
      if (typeof j.highlight !== 'boolean') j.highlight = false;
      if (!('bedSize' in j)) j.bedSize = null;
      ['trialRequestedAt','trialPlannedDate','trialStart','trialEnd',
       'deliveredAt','paidAt','parkedAt','reviveOn'].forEach(function (k) {
        if (!(k in j)) j[k] = null;
      });
      if (typeof j.paid !== 'boolean') j.paid = false;
      if (!('expectedRevenue' in j)) j.expectedRevenue = null;
      if (!j.seedBatch) j.seedBatch = '';
      j.value = Number(j.value) || 0;
    });
    (doc.plans || []).forEach(function (p) {
      if (typeof p.done !== 'boolean') p.done = false;
      if (!p.bucket) p.bucket = 'W1';
      if (typeof p.owner !== 'string') p.owner = '';
      if (!('startDate' in p)) p.startDate = null;
      if (!('dueDate' in p)) p.dueDate = null;
    });
    (doc.discussions || []).forEach(function (d) {
      if (!d.askType) d.askType = 'opinion';
      if (!d.status) d.status = 'open';
      ['topic','context','options','proposedBy','decision','decidedBy'].forEach(function (k) {
        if (typeof d[k] !== 'string') d[k] = d[k] == null ? '' : String(d[k]);
      });
    });
    return doc;
  }

  // ---- autosave -----------------------------------------------------------
  function touch(countEdit) {
    if (!SP.state) return;
    SP.state.meta.updatedAt = SP.U.nowISO();
    if (countEdit !== false) SP.state.meta.editsSinceSave = (SP.state.meta.editsSinceSave || 0) + 1;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
    if (SP.Render && SP.Render.header) SP.Render.header();
  }
  function flush() {
    if (!SP.state) return;
    var ok = lsSet(stateKey(SP.state.meta.docId), SP.state);
    if (ok) {
      saveMode = 'ok';
      var idx = lsGet(INDEX_KEY) || {};
      idx[SP.state.meta.docId] = {
        title: SP.state.meta.title, weekOf: SP.state.meta.weekOf,
        revision: SP.state.meta.revision, savedAt: SP.state.meta.savedAt,
        touchedAt: SP.U.nowISO()
      };
      lsSet(INDEX_KEY, idx);
    } else if (saveMode !== 'memory') {
      saveMode = 'memory';
      if (SP.Render && SP.Render.all) SP.Render.all();
    }
  }
  function mode() { return saveMode; }
  function forceMemoryMode() { saveMode = 'memory'; }   // ไว้ทดสอบ path นี้โดยตั้งใจ

  // ---- mutation API — ทุกการเขียน state ต้องผ่านทางนี้เท่านั้น -------------
  function patch(coll, id, changes) {
    var item = SP.U.byId(SP.state[coll] || [], id);
    if (!item) return null;
    Object.keys(changes).forEach(function (k) { item[k] = changes[k]; });
    item.updatedAt = SP.U.nowISO();
    touch();
    return item;
  }
  function add(coll, item) {
    SP.state[coll] = SP.state[coll] || [];
    item.createdAt = item.createdAt || SP.U.nowISO();
    item.updatedAt = item.updatedAt || item.createdAt;
    SP.state[coll].push(item);
    touch();
    return item;
  }
  function remove(coll, id) {
    var arr = SP.state[coll] || [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === id) { arr.splice(i, 1); touch(); return true; }
    }
    return false;
  }
  function setMeta(changes) {
    Object.keys(changes).forEach(function (k) { SP.state.meta[k] = changes[k]; });
    touch();
  }

  // ---- undo snapshot (ชั้นเดียว ใช้กับการนำเข้า) ---------------------------
  function pushUndo(label) {
    lsSet(undoKey(SP.state.meta.docId), { label:label, at:SP.U.nowISO(), doc:SP.state });
  }
  function peekUndo() { return SP.state ? lsGet(undoKey(SP.state.meta.docId)) : null; }
  function popUndo() {
    var u = peekUndo(); if (!u) return null;
    lsDel(undoKey(SP.state.meta.docId));
    return u;
  }

  // ---- boot ---------------------------------------------------------------
  /* ตัดสินด้วย meta.revision ไม่ใช่ timestamp — นาฬิกาคนละเครื่องเชื่อไม่ได้
     และโจทย์จริงคือ "ไฟล์นี้เป็นรุ่นที่เท่าไรของสายพันธุ์" ไม่ใช่ "ใครพิมพ์ทีหลัง" */
  function readSeed() {
    var el = document.getElementById('seed-data');
    try { return migrate(JSON.parse(el.textContent)); }
    catch (e) { console.error('seed-data พัง:', e); return null; }
  }
  function readLocal(docId) {
    var d = lsGet(stateKey(docId));
    return d ? migrate(d) : null;
  }
  function decide(seed, saved) {
    if (!saved) return { use:'seed', why:'fresh' };
    var rs = Number(seed.meta.revision) || 0, rl = Number(saved.meta.revision) || 0;
    if (rl < rs) return { use:'ask', why:'fileNewer' };
    if (rl > rs) return { use:'ask', why:'localNewer' };
    return { use:'local', why:'same' };
  }
  function use(doc) { SP.state = doc; return doc; }

  return {
    stateKey:stateKey, UI_KEY:UI_KEY, INDEX_KEY:INDEX_KEY,
    lsGet:lsGet, lsSet:lsSet, lsDel:lsDel,
    loadUI:loadUI, saveUI:saveUI, ui:ui,
    migrate:migrate, touch:touch, flush:flush, mode:mode, forceMemoryMode:forceMemoryMode,
    patch:patch, add:add, remove:remove, setMeta:setMeta,
    pushUndo:pushUndo, peekUndo:peekUndo, popUndo:popUndo,
    readSeed:readSeed, readLocal:readLocal, decide:decide, use:use
  };
})();
</script>

<script>
/* ============================================================================
   BLOCK 04 — NORM
   ตัวแปลงค่าจากสเปรดชีต พอร์ตมาจาก js/mock-data.js:222-338 พร้อมแก้ 3 จุด
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Norm = (function () {
  'use strict';
  var THAI_DIGITS = '๐๑๒๓๔๕๖๗๘๙';

  /* value — ต่อยอด mock-data.js:269-270
     แก้: parseFloat แทน parseInt (รองรับ "4.5 ล้าน"), เลขไทย, ตัวคูณ ล้าน, ฿ */
  function value(raw) {
    if (typeof raw === 'number') return Math.round(raw);
    var s = String(raw == null ? '' : raw);
    s = s.replace(/[๐-๙]/g, function (d) { return String(THAI_DIGITS.indexOf(d)); });
    s = s.replace(/["',\s฿]/g, '').trim();
    if (!s || s === '-' || s.toUpperCase() === 'N/A') return 0;
    var million = /ล้าน|ลบ\./.test(s);
    var n = parseFloat(s.replace(/[^\d.]/g, ''));
    if (!isFinite(n)) return 0;
    return Math.round(million ? n * 1e6 : n);
  }

  /* budget level — แก้บั๊กจริงของ mock-data.js:280-285 ที่ใช้ startsWith()
     startsWith คืน Level 4 เงียบ ๆ ให้ทั้ง "Level 1" (ขึ้นต้น L)
     และ " 1 (E-Bid)" (มีช่องว่างนำ ซึ่งมีอยู่จริงในไฟล์ต้นทาง) */
  function budget(raw) {
    var m = String(raw == null ? '' : raw).trim().match(/[1-5]/);
    return m ? 'Level ' + m[0] : 'Level 4';
  }

  /* stage — คัดลอก cascade ของ mock-data.js:288-306 ตรงตัว (ห้ามปรับลำดับ
     มันจูนมาตามคำที่ทีมนี้ใช้จริงในสเปรดชีต) แต่ผลลัพธ์ยังเป็น "รหัสชุดเดิม S0–S9"
     แล้วค่อยส่งผ่าน C.migrateStage() ทีเดียวตอนท้าย — จุดแปลงรหัสจึงมีที่เดียว
     ในระบบ ไม่ต้องไล่แก้หลายที่ทุกครั้งที่โครงขั้นเปลี่ยน */
  function legacyStage(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return 'S0';
    var m = s.match(/^S[0-9]+(-[0-9]+)?(_WON)?/i);
    if (m) {
      var code = m[0].toUpperCase();
      if (code === 'S4-1') code = 'S5';
      if (code === 'S7_WON') code = 'S8_WON';
      return code;
    }
    var ls = s.toLowerCase();
    function has() {
      for (var i = 0; i < arguments.length; i++) if (ls.indexOf(arguments[i]) >= 0) return true;
      return false;
    }
    if (has('won', 'ชนะ')) return 'S8_WON';
    if (has('lost', 'ไม่สำเร็จ', 'สูญเสีย')) return 'S9';
    /* S10 ไม่มีในชุดรหัสเดิม แต่ migrateStage() ปล่อยผ่านเพราะมีอยู่ใน STAGES
       ใช้วลีเฉพาะเจาะจง ไม่ใช้คำว่า "พัก" หรือ "hold" ลอย ๆ ที่ไปชนข้อความอื่นได้ */
    if (has('ไม่ได้ทำต่อ', 'พักโครงการ', 'ชะลอ', 'on hold', 'parked', 'dropped')) return 'S10';
    if (has('กำลังดำเนินการจัดซื้อ', 'e-bidding', 's7')) return 'S7';
    if (has('รอกระบวนการจัดซื้อ', 'รออนุมัติ', 's6')) return 'S6';
    if (has('พิจารณา', 's5', 's4-1')) return 'S5';
    if (has('tor', 'เสนอราคา', 's4')) return 'S4';
    if (has('demo', 'trial', 's3')) return 'S3';
    if (has('คฉ', 'ความต้องการ', 's2')) return 'S2';
    if (has('ติดต่อ', 'เข้าพบ', 's1')) return 'S1';
    return 'S0';
  }

  /* สเปรดชีตของทีมใช้รหัสชุดเดิมทั้งหมด จึงแปลงเป็นชุดใหม่ให้เสมอ
     ผลลัพธ์เห็นได้ในตัวอย่าง 5 แถวแรกของ wizard ก่อนกดนำเข้าจริง */
  function stage(raw) { return SP.C.migrateStage(legacyStage(raw)); }

  /* product group — ขยาย mock-data.js:308 (เดิมเป็น ternary บรรทัดเดียวที่ออก ERP ไม่ได้)
     ลำดับสำคัญ: Custom มาก่อนสุด เพราะ RCM จะโดน /การเงิน/ ดูดไป ERP
     และ Checkup จะโดน /เวชระเบียน/ ดูดไป HIS ทั้งที่ทั้งคู่เป็นงานพัฒนาเฉพาะ
     MEDIQ มาก่อน KIOSK เพราะ "MediQ — Kiosk" คือสินค้า MediQ ไม่ใช่ดีลฮาร์ดแวร์ */
  var PG_RULES = [
    ['Custom', /rcm|เคลม|เบิกจ่าย|รับรู้รายได้|checkup|ตรวจสุขภาพ|แฟ้มข้อมูลสุขภาพ|ระบาดวิทยา/i],
    ['MEDIQ',  /mediq|เมดิคิว|ระบบคิว|คิวอัตโนมัติ|queue/i],
    ['KIOSK',  /kiosk|คีออส|ตู้|ฮาร์ดแวร์|hardware|เครื่องอ่านบัตร/i],
    ['HIS',    /medicore|\bhis\b|เวชระเบียน|paperless|ไร้กระดาษ|ผู้ป่วยใน|\bipd\b|\bemr\b/i],
    ['ERP',    /\berp\b|บัญชี|พัสดุ|คลัง|การเงิน/i]
  ];
  function productGroup(product, explicit) {
    if (explicit) {
      var e = String(explicit).trim();
      // ไฟล์ระบุหมวดมาเอง = ไฟล์ชนะเสมอ ตัวเดาไม่มีทางถูก 100% กับคำก้ำกึ่ง
      var keys = Object.keys(SP.C.PRODUCT_GROUPS);
      for (var i = 0; i < keys.length; i++) {
        if (e.toUpperCase() === keys[i].toUpperCase()) return keys[i];
        if (e.toLowerCase() === SP.C.PRODUCT_GROUPS[keys[i]].nameTH.toLowerCase()) return keys[i];
      }
    }
    var p = String(product == null ? '' : product);
    for (var k = 0; k < PG_RULES.length; k++) if (PG_RULES[k][1].test(p)) return PG_RULES[k][0];
    return 'Custom';
  }

  function customerGroup(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return 'รพ.รัฐ';
    if (SP.C.CUSTOMER_GROUPS.indexOf(s) >= 0) return s;
    if (/ทหาร|กองทัพ|ค่าย|เสนารักษ์/.test(s)) return 'ทหารบก';
    if (/เอกชน|private/i.test(s)) return 'รพ.เอกชน';
    return 'รพ.รัฐ';
  }

  function interest(budgetCode) {
    if (budgetCode === 'Level 1' || budgetCode === 'Level 5') return 'hot';
    if (budgetCode === 'Level 2' || budgetCode === 'Level 3') return 'warm';
    return 'cold';
  }

  /* คีย์จับคู่ตอนรวมข้อมูล — ไม่สนช่องว่างเป็นเรื่องจำเป็น ไม่ใช่ทางเลือก:
     ไฟล์ต้นทางมี 'รพ.ค่ายธนรัตน์ ' และ 'รพ.ค่ายสุรศักดิมนตรี ' ที่มีช่องว่างท้าย
     แต่ห้ามฉลาดถึงขั้นตัดคำนำหน้า รพ./โรงพยาบาล — false positive ระหว่าง
     รพ.ค่ายทหารที่ชื่อคล้ายกันแย่กว่าการรวมด้วยมือ */
  function key(name) { return String(name || '').replace(/\s+/g, '').toLowerCase(); }
  function jobKey(name, pg) { return key(name) + '|' + pg; }

  function levenshtein(a, b) {
    a = key(a); b = key(b);
    if (a === b) return 0;
    if (!a.length || !b.length) return Math.max(a.length, b.length);
    var prev = [], cur = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur.slice();
    }
    return prev[b.length];
  }

  /* แถวหัวข้อกลุ่ม (🔵/🟢) — mock-data.js:245 ข้ามทิ้ง แต่ที่นี่เก็บไว้เป็น
     sectionLabel เพราะสไลด์ประชุมจัดกลุ่มตามป้ายพวกนี้พอดี
     นี่คือการอ่าน emoji ที่อยู่ใน "ข้อมูล" ไม่เกี่ยวกับกฎห้าม emoji ใน UI */
  var EMOJI = /^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/u;
  function sectionLabel(cell) { return String(cell || '').replace(EMOJI, '').trim(); }
  function isSectionRow(cell) { return EMOJI.test(String(cell || '')); }

  /* job เปล่าที่มีทุกฟิลด์ — seed, import และการเพิ่มด้วยมือใช้ตัวเดียวกัน
     เพื่อให้ทุก record มีรูปร่างเดียวกันเสมอ */
  function blankJob(over) {
    var j = {
      id:'', seedBatch:'',
      customerName:'', customerGroup:'รพ.รัฐ', province:'', sectionLabel:'', bedSize:null,
      trialRequestedAt:null, trialPlannedDate:null, trialStart:null, trialEnd:null,
      contacts:[], incumbent:'', intel:'', relatedTo:[], egpProjectId:'',
      product:'', productGroup:'Custom', value:0,
      stage:'S0', budgetCode:'Level 4', budgetYear:'',
      expectedRevenue:null, salesStatus:'', detail:'', remark:'',
      assignedTo:[], interest:'cold',
      isNewThisWeek:false, newSince:null, workStatus:'active',
      blockReason:'', waitingFor:'', waitingOn:'', statusSince:null,
      deliveredAt:null, paid:false, paidAt:null,
      parkedAt:null, parkReason:'', reviveOn:null,
      presentVisible:true, presentOrder:null, highlight:false, weekNote:'',
      stageHistory:[], createdAt:SP.U.nowISO(), updatedAt:SP.U.nowISO()
    };
    if (over) Object.keys(over).forEach(function (k) { j[k] = over[k]; });
    return j;
  }

  return {
    value:value, budget:budget, stage:stage, legacyStage:legacyStage, productGroup:productGroup,
    customerGroup:customerGroup, interest:interest,
    key:key, jobKey:jobKey, levenshtein:levenshtein,
    sectionLabel:sectionLabel, isSectionRow:isSectionRow, blankJob:blankJob,
    PG_RULES:PG_RULES
  };
})();
</script>

<script>
/* ============================================================================
   BLOCK 05 — UIKIT + ACTIONS + RENDER ROUTER
   modal/toast เขียนเอง ไม่พึ่ง Bootstrap JS — ตัด dependency เชิงฟังก์ชันตัวเดียว
   ที่เหลืออยู่ออก ทำให้หน้านี้ทำงานครบแม้ไม่มีเน็ตเลย
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Modal = (function () {
  'use strict';
  var U = SP.U, layer = null, cbs = {};

  function el() { return layer || (layer = document.getElementById('modal-layer')); }

  /* opts: {title, icon, html, buttons:[{label,cls,id,keep}], onClick(id)} */
  function open(opts) {
    cbs = {}; cbs.onClick = opts.onClick || function () {};
    var btns = (opts.buttons || [{ label:'ปิด', id:'close', cls:'btn' }]).map(function (b) {
      return '<button class="' + (b.cls || 'btn') + '" data-act="modal:btn" data-id="' + U.attr(b.id) + '">' +
             (b.icon ? U.ic(b.icon) : '') + U.esc(b.label) + '</button>';
    }).join('');
    el().innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3>' + (opts.icon ? U.ic(opts.icon, 'ic-lg') : '') + U.esc(opts.title || '') + '</h3>' +
        '<div>' + (opts.html || '') + '</div>' +
        '<div class="modal-ft">' + btns + '</div>' +
      '</div>';
    var first = el().querySelector('input,select,textarea,button');
    if (first) try { first.focus(); } catch (e) {}
  }
  function close() {
    var fn = cbs.onClose;
    el().innerHTML = '';
    cbs = {};
    if (fn) fn();
  }
  function click(id) {
    var fn = cbs.onClick;
    var keepOpen = fn ? fn(id, el()) : false;
    if (!keepOpen) close();
  }
  function isOpen() { return !!el().innerHTML; }

  /* ยืนยันแบบง่าย — ใช้แทน window.confirm ทั้งหมด เพื่อให้ข้อความไทยจัดรูปแบบได้ */
  function confirm(opts, onYes) {
    open({
      title: opts.title, icon: opts.icon || 'alert',
      html: opts.html || '',
      buttons: [
        { label: opts.cancel || 'ยกเลิก', id:'no', cls:'btn' },
        { label: opts.ok || 'ยืนยัน', id:'yes', cls: opts.danger ? 'btn btn-danger' : 'btn btn-primary' }
      ],
      onClick: function (id) { if (id === 'yes') onYes(); }
    });
  }
  return { open:open, close:close, click:click, confirm:confirm, isOpen:isOpen, el:el };
})();

SP.Toast = (function () {
  'use strict';
  function show(msg, kind, ms) {
    var l = document.getElementById('toast-layer');
    var d = document.createElement('div');
    d.className = 'toast ' + (kind || '');
    d.innerHTML = SP.U.ic(kind === 'bad' ? 'alert' : (kind === 'warn' ? 'info' : 'check-circle')) +
                  '<span>' + SP.U.esc(msg) + '</span>';
    l.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, ms || 4200);
  }
  return { show:show };
})();

/* --------------------------------------------------------------------------
   ACTIONS — event delegation ทั้งหน้า ไม่มี inline onclick แม้แต่ที่เดียว
   เหตุผล: ชื่อ รพ. หรือข้อความ blockReason ที่มี ' จะทำ handler ในแอตทริบิวต์พัง
   และ innerHTML re-render ทำให้ไม่มีอะไรให้ re-bind อยู่แล้ว
   -------------------------------------------------------------------------- */
SP.Actions = (function () {
  'use strict';
  var map = {};
  function on(name, fn) { map[name] = fn; }
  function run(name, ds, ev) {
    var fn = map[name];
    if (!fn) { console.warn('ไม่รู้จัก action:', name); return; }
    try { fn(ds, ev); } catch (e) { console.error('action ' + name + ' ล้มเหลว', e); SP.Toast.show('เกิดข้อผิดพลาด: ' + e.message, 'bad'); }
  }

  /* data-field="<coll>:<id>:<field>" หรือ "meta:<field>" / "settings:<field>" */
  function readEl(t) {
    if (t.type === 'checkbox') return t.checked;
    if (t.type === 'number') return t.value === '' ? null : Number(t.value);
    if (t.multiple) return Array.prototype.slice.call(t.selectedOptions).map(function (o) { return o.value; });
    return t.value;
  }
  function field(t, rerender) {
    var spec = (t.getAttribute('data-field') || '').split(':');
    var v = readEl(t);
    if (spec[0] === 'meta')     { SP.state.meta[spec[1]] = v; SP.Store.touch(); }
    else if (spec[0] === 'settings') { SP.state.settings[spec[1]] = v; SP.Store.touch(); }
    else if (spec[0] === 'ui')  { SP.ui[spec[1]] = v; SP.Store.saveUI(); }
    else {
      var changes = {}; changes[spec[2]] = v;
      SP.Hooks.beforeField(spec[0], spec[1], spec[2], v, t);
      SP.Store.patch(spec[0], spec[1], changes);
      SP.Hooks.afterField(spec[0], spec[1], spec[2], v, t);
    }
    if (rerender) SP.Render.current();
  }
  return { on:on, run:run, field:field, map:map };
})();

/* hook points ที่ view ต่าง ๆ เอาไปเสียบ (เช่น validation ตอนเปลี่ยน workStatus) */
SP.Hooks = { beforeField: function () {}, afterField: function () {} };

/* --------------------------------------------------------------------------
   RENDER ROUTER
   -------------------------------------------------------------------------- */
SP.Render = (function () {
  'use strict';
  var U = SP.U, C = SP.C;
  var views = {};                    // id -> render function (แต่ละ view ลงทะเบียนเอง)
  function register(id, fn) { views[id] = fn; }

  function counts() {
    var s = SP.state;
    return {
      week: s.jobs.filter(function (j) { return j.isNewThisWeek; }).length,
      board: s.jobs.length,
      plan: s.plans.filter(function (p) { return !p.done; }).length,
      discuss: s.discussions.filter(function (d) { return d.status === 'open'; }).length
    };
  }

  function header() {
    var s = SP.state, m = s.meta, n = counts();
    var dirty = (m.editsSinceSave || 0) > 0;
    var badge = dirty
      ? '<span class="savebadge dirty" title="ยังไม่ได้บันทึกเป็นไฟล์"><span class="dot"></span>แก้ไข ' +
        m.editsSinceSave + ' ครั้ง หลังบันทึกไฟล์รอบที่ ' + (m.revision || 1) + '</span>'
      : '<span class="savebadge clean">' + U.ic('check-circle') + 'รอบที่ ' + (m.revision || 1) +
        (m.savedBy ? ' · ' + U.esc(m.savedBy) : '') +
        (m.savedAt ? ' · ' + U.esc(U.fmtDate(m.savedAt, 'datetime')) : ' · ยังไม่เคยบันทึกไฟล์') + '</span>';

    var memWarn = SP.Store.mode() === 'memory'
      ? '<div class="wrap"><div class="banner banner-bad" style="margin:8px 0">' + U.ic('alert') +
        '<div><b>เบราว์เซอร์นี้บันทึกอัตโนมัติไม่ได้</b><br>ข้อมูลอยู่ในหน่วยความจำเท่านั้น — กรุณากด “บันทึกเป็นไฟล์ HTML” ก่อนปิดหน้าต่าง</div></div></div>'
      : '';

    var tabs = C.TABS.map(function (t) {
      var c = n[t.id];
      return '<button class="tab" role="tab" aria-selected="' + (SP.ui.activeTab === t.id) + '" ' +
             'data-act="tab" data-id="' + t.id + '">' + U.ic(t.icon) + U.esc(t.th) +
             (c ? '<span class="count">' + c + '</span>' : '') + '</button>';
    }).join('');

    document.getElementById('app-header').innerHTML =
      '<div class="wrap hdr-top">' +
        '<div class="brand">' +
          '<span class="brand-mark">' + U.ic('target', 'ic-lg') + '</span>' +
          '<span><span class="brand-title">' + U.esc(m.title) + '</span>' +
          '<span class="brand-sub">' + U.esc(U.weekLabel(m.weekOf)) + '</span></span>' +
        '</div>' +
        '<label class="week-pick" title="สัปดาห์ของเอกสารนี้ — แก้ได้ ไม่ใช่คำนวณล้วน">' +
          U.ic('calendar') +
          '<input type="date" data-field="meta:weekOf" value="' + U.attr(m.weekOf) + '" aria-label="สัปดาห์ของเอกสาร">' +
        '</label>' +
        '<span class="spacer"></span>' +
        '<div class="hdr-actions">' + badge +
          '<button class="btn btn-dark" data-act="report:print">' + U.ic('print') + 'พิมพ์ / PDF</button>' +
          '<button class="btn btn-primary" data-act="export:html">' + U.ic('save') + 'บันทึกเป็นไฟล์ HTML</button>' +
        '</div>' +
      '</div>' +
      memWarn +
      '<div class="wrap"><div class="tabs" role="tablist">' + tabs + '</div></div>';
    document.title = m.title;
  }

  function view(id) {
    var host = document.getElementById('view-' + id);
    if (!host) return;
    host.innerHTML = views[id] ? views[id]() : '';
  }
  function current() {
    header();
    view(SP.ui.activeTab);
    if (SP.JobEdit && SP.JobEdit.sync) SP.JobEdit.sync();
  }
  function all() {
    header();
    C.TABS.forEach(function (t) {
      var host = document.getElementById('view-' + t.id);
      if (host) host.hidden = (t.id !== SP.ui.activeTab);
    });
    view(SP.ui.activeTab);
  }
  function tab(id) {
    SP.ui.activeTab = id;
    SP.Store.saveUI();
    all();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  return { register:register, header:header, view:view, current:current, all:all, tab:tab, counts:counts };
})();


/* --------------------------------------------------------------------------
   DRAWER — แผงเลื่อนจากขวา ใช้กับฟอร์มที่มีหลายช่อง (เพิ่ม/แก้แผนงาน)
   ดีกว่าแก้ในบรรทัด: ช่องกว้างพอ ป้ายกำกับครบ และไม่ทำให้การ์ดกระโดด
   -------------------------------------------------------------------------- */
SP.Drawer = (function () {
  'use strict';
  var U = SP.U, cbs = {};
  function el() { return document.getElementById('drawer-layer'); }

  /* opts: {title, icon, html, wide, buttons:[{label,cls,id,icon}], onClick(id, root), onClose()} */
  function open(opts) {
    cbs.onClick = opts.onClick || function () {};
    cbs.onClose = opts.onClose || null;
    var btns = (opts.buttons || []).map(function (b) {
      return '<button class="' + (b.cls || 'btn') + '" data-act="drawer:btn" data-id="' + U.attr(b.id) + '">' +
             (b.icon ? U.ic(b.icon) : '') + U.esc(b.label) + '</button>';
    }).join('');
    el().innerHTML =
      '<div class="drawer-back" data-act="drawer:close"></div>' +
      '<aside class="drawer' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
        '<div class="drawer-hd">' + (opts.icon ? U.ic(opts.icon, 'ic-lg') : '') +
          '<h3>' + U.esc(opts.title || '') + '</h3>' +
          '<button class="btn btn-icon btn-ghost" data-act="drawer:close" aria-label="ปิด">' + U.ic('close') + '</button>' +
        '</div>' +
        '<div class="drawer-bd">' + (opts.html || '') + '</div>' +
        '<div class="drawer-ft">' + btns + '</div>' +
      '</aside>';
    var first = el().querySelector('.drawer-bd textarea, .drawer-bd input, .drawer-bd select');
    if (first) try { first.focus(); } catch (e) {}
  }
  function close() {
    var fn = cbs.onClose;
    el().innerHTML = '';
    cbs = {};
    if (fn) fn();
  }
  function isOpen() { return !!el().innerHTML; }
  function click(id) {
    var keep = cbs.onClick ? cbs.onClick(id, el()) : false;
    if (!keep) close();
  }
  /* วาดเนื้อหาใหม่โดยไม่ปิด drawer — ใช้กับฟอร์มที่ผูกข้อมูลแบบสด */
  function setBody(html) {
    var bd = el().querySelector('.drawer-bd');
    if (bd) bd.innerHTML = html;
  }
  function val(sel) {
    var n = el().querySelector(sel);
    return n ? n.value : '';
  }
  return { open:open, close:close, click:click, isOpen:isOpen, el:el, val:val, setBody:setBody };
})();

SP.Actions.on('drawer:btn',   function (ds) { SP.Drawer.click(ds.id); });
SP.Actions.on('drawer:close', function ()   { SP.Drawer.close(); });

SP.Actions.on('tab',        function (ds) { SP.Render.tab(ds.id); });
SP.Actions.on('modal:btn',  function (ds) { SP.Modal.click(ds.id); });
SP.Actions.on('modal:close',function ()   { SP.Modal.close(); });
SP.Actions.on('noop',       function ()   {});

/* พิมพ์รายงาน — สลับไปแท็บสรุปก่อนเสมอ เพราะ print CSS ออกแบบมาสำหรับหน้านั้น */
SP.Actions.on('report:print', function () {
  if (SP.ui.activeTab !== 'week') SP.Render.tab('week');
  setTimeout(function () { window.print(); }, 80);
});
</script>

<script>
/* ============================================================================
   BLOCK 06 — VIEW: board  (+ SP.JobCard ที่ view อื่นเรียกใช้ร่วมกัน)
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.JobCard = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  function stuckDays(j) {
    if (j.workStatus !== 'blocked' && j.workStatus !== 'waiting') return null;
    return U.daysSince(j.statusSince);
  }

  /* แสดงเฉพาะงานที่เลือกไว้บนการ์ดนี้เท่านั้น — ไม่ไล่ลิงก์ย้อนกลับ
     เพราะโครงการส่วนใหญ่เป็นโครงการเดี่ยว การโผล่ของงานที่เจ้าของการ์ดไม่เคยเลือก
     ทำให้อ่านแล้วงงมากกว่าช่วย · ไม่เลือก = ไม่แสดงหัวข้อนี้เลย */
  function relatedJobs(j) {
    return (j.relatedTo || [])
      .map(function (id) { return SP.U.byId(SP.state.jobs, id); })
      .filter(function (o) { return o && o.id !== j.id; });
  }

  /* opts: {compact, showIntel, editable} */
  function render(j, opts) {
    opts = opts || {};
    var days = stuckDays(j);
    var cls = 'job';
    if (!j.presentVisible) cls += ' hidden-present';
    if (days !== null && days > 21) cls += ' stuck';
    var col = C.STAGE_COLORS[j.stage] || '#98A2B3';
    var isOpen = !!(SP.ui.openJobs && SP.ui.openJobs[j.id]);
    if (isOpen) cls += ' open';

    var acts = opts.editable === false ? '' :
      '<div class="job-acts">' +
        (j.highlight
          ? '<button class="btn btn-icon btn-ghost" style="color:#F79009" data-act="job:highlight" data-id="' + j.id + '" title="เลิกปักหมุดจากหน้าปก" aria-label="เลิกปักหมุด">' + U.ic('star') + '</button>'
          : '<button class="btn btn-icon btn-ghost muted" data-act="job:highlight" data-id="' + j.id + '" title="ปักหมุดขึ้นหน้าปกสไลด์" aria-label="ปักหมุด">' + U.ic('star') + '</button>') +
        '<button class="btn btn-icon btn-ghost ' + (j.presentVisible ? 'muted' : '') + '" data-act="job:present" data-id="' + j.id + '" ' +
          'title="' + (j.presentVisible ? 'ซ่อนงานนี้จากรายงานสรุป' : 'แสดงงานนี้ในรายงานสรุป') + '" ' +
          'aria-label="' + (j.presentVisible ? 'ซ่อนจากรายงาน' : 'แสดงในรายงาน') + '">' +
          U.ic(j.presentVisible ? 'eye' : 'eye-off') + '</button>' +
        '<button class="btn btn-icon btn-ghost muted" data-act="job:edit" data-id="' + j.id + '" title="แก้ไขงานนี้" aria-label="แก้ไข">' +
          U.ic('edit') + '</button>' +
      '</div>';

    var meta = [];
    meta.push(U.stageBadge(j.stage));
    meta.push(U.groupBadge(j.productGroup));
    meta.push(U.levelBadge(j.budgetCode));
    if (j.budgetYear) meta.push('<span class="badge badge-soft">ปีงบ ' + U.esc(j.budgetYear) + '</span>');
    if (j.isNewThisWeek) meta.push('<span class="badge" style="background:#ECFDF3;color:#027A48">' + U.ic('new') + 'ใหม่สัปดาห์นี้</span>');
    var sb = U.statusBadge(j.workStatus);
    if (sb) meta.push(sb);
    if (!j.presentVisible) meta.push('<span class="badge badge-soft">' + U.ic('eye-off') + 'ซ่อนจากรายงาน</span>');

    var sub = [];
    if (j.customerGroup) sub.push(U.esc(j.customerGroup));
    if (j.province) sub.push(U.ic('map-pin') + U.esc(j.province));
    if (j.bedSize) sub.push(U.ic('bed') + U.esc(j.bedSize) + ' เตียง');
    if (j.incumbent) sub.push(U.ic('shield') + 'ระบบเดิม: ' + U.esc(j.incumbent));

    var reason = '';
    if ((j.workStatus === 'blocked' || j.workStatus === 'hold') && j.blockReason) {
      var hold = j.workStatus === 'hold';
      reason = '<div class="job-note" style="background:' + (hold ? '#F2F4F7;color:#344054' : '#FEF3F2;color:#912018') + '">' +
               U.ic(hold ? 'pause' : 'blocked') +
               ' <b>' + (hold ? 'Hold:' : 'หยุดเพราะ:') + '</b> ' + U.nl2br(j.blockReason) +
               (days !== null ? ' <span class="tiny">· ค้างมา ' + days + ' วัน</span>' : '') + '</div>';
    } else if (j.workStatus === 'waiting' && j.waitingFor) {
      reason = '<div class="job-note" style="background:#FFFAEB;color:#93370D">' + U.ic('clock') +
               ' <b>รอ' + (j.waitingOn ? U.esc(j.waitingOn) : '') + ':</b> ' + U.nl2br(j.waitingFor) +
               (days !== null ? ' <span class="tiny">· รอมา ' + days + ' วัน</span>' : '') + '</div>';
    }

    /* Trial: ขั้น S2 ต้องรู้ว่ารอมากี่วันแล้ว · S3 ต้องรู้ว่าเหลือกี่วันก่อนต้องสรุปผล */
    var t = U.trialInfo(j);
    var trial = '';
    if (t.mode !== 'none') {
      var tcls = t.mode === 'overdue' ? 'trial bad' : (t.warn ? 'trial warn' : 'trial');
      var bar = '';
      if (t.mode === 'running' && t.total) {
        bar = '<span class="trial-bar"><i style="width:' +
              Math.max(2, Math.min(100, Math.round(t.day / t.total * 100))) + '%"></i></span>';
      }
      trial = '<div class="' + tcls + '">' + U.ic(t.mode === 'waiting' || t.mode === 'scheduled' ? 'clock' : 'target') +
              '<span>' + U.esc(U.trialText(j)) + '</span>' + bar + '</div>';
    }

    /* ส่งมอบ/ชำระเงิน -- ใช้สีบอกสถานะ เขียว = เงินเข้าแล้ว, เหลือง/แดง = ยังค้าง */
    var dv = U.deliveryInfo(j);
    var delivery = '';
    if (dv.mode !== 'none') {
      var dcls = dv.mode === 'paid' ? 'trial paid' : (dv.warn ? 'trial bad' : 'trial warn');
      delivery = '<div class="' + dcls + '">' + U.ic(dv.mode === 'paid' ? 'check-circle' : 'money') +
                 '<span>' + U.esc(U.deliveryText(j)) + '</span></div>';
    }

    /* พักงาน -- เทาปกติ, แดงเมื่อเลยวันนัดทบทวนหรือพักเกิน 90 วันโดยไม่มีกำหนด */
    var pk = U.parkInfo(j);
    var park = '';
    if (pk.mode !== 'none') {
      park = '<div class="' + (pk.warn ? 'trial bad' : 'trial park') + '">' + U.ic('pause') +
             '<span>' + U.esc(U.parkText(j)) + '</span></div>' +
             (j.parkReason

        (sub.length ? '<div class="job-meta tiny muted">' + sub.join(' · ') + '</div>' : '') +

        detailHtml + remarkHtml +

      '<div class="field-row">' +

        '<div class="field" style="flex:1 1 200px"><label>หมายเหตุ</label><textarea class="inp" rows="3" data-field="jobs:' + j.id + ':remark">' + U.esc(j.remark) + '</textarea></div>' +
