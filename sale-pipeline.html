<script>
/* ============================================================================
   BLOCK 11 — EXPORT  (บันทึกเป็นไฟล์ HTML ใหม่ / JSON)
   ล้าง innerHTML ของ render root ทุกตัวแล้วเขียน seed ใหม่ แทนที่จะ serialize
   DOM สด เพราะ DOM สดจะ (ก) ไฟล์ใหญ่เท่าตัว (ข) ฝังแท็บ/ฟิลเตอร์ที่ค้างอยู่
   (ค) ติด modal ที่เปิดค้าง (ง) เจอบั๊ก input.value vs input[value] — พิมพ์ใน
   ช่องข้อความแล้ว property เปลี่ยนแต่ attribute ไม่เปลี่ยน ข้อความที่ export
   ออกไปจะเป็นของก่อนแก้
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Export = (function () {
  'use strict';
  var U = SP.U;
  var busy = false;

  /* escape ทุกตัว "<" ไม่ใช่แค่แท็กปิดสคริปต์ — type="application/json" ไม่ถูก execute
     แต่ HTML tokenizer ยังปิด script element ทันทีที่เจอแท็กปิด (ไม่สนตัวพิมพ์เล็กใหญ่
     และไม่สนว่าอยู่ในสตริงหรือคอมเมนต์) การ escape "<" ทั้งหมดยังกัน "<!--" ที่
     tokenizer ตีความพิเศษด้วย · "<" ใน JSON string กลับเป็น "<" เองตอน JSON.parse

     *** ห้ามเขียนแท็กปิดสคริปต์เป็นตัวอักษรจริงในบล็อกนี้หรือบล็อกไหนก็ตาม ***
     เคยพลาดมาแล้ว: คอมเมนต์ที่อธิบายเรื่องนี้เองใส่แท็กปิดตัวจริงลงไป ทำให้
     tokenizer ตัดบล็อกกลางคัน SP.Export ไม่ถูกสร้าง และปุ่มบันทึกไฟล์ตายเงียบ ๆ
     ตอนนี้ assemble.py ตรวจให้แล้ว ถ้าใส่กลับเข้าไปจะประกอบไฟล์ไม่ผ่าน */
  function embedJson(obj) {
    return JSON.stringify(obj)
      .replace(/</g, '\\u003C')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');
  }

  /* ASCII ล้วน — Chrome รับชื่อไทยใน download= ได้ แต่ไฟล์ต้องผ่าน Outlook /
     LINE / file share ที่พังชื่อไทยได้ทุกทาง · ท้ายด้วย YYYYMMDD แบบ ค.ศ.
     เพื่อให้เรียงตามเวลาใน Explorer ได้ถูกลำดับเสมอ แม้ข้ามรอยต่อปี */
  function filename(m, ext) {
    var d = U.toDate(m.weekOf + 'T00:00:00') || new Date();
    return 'sale-pipeline-' + m.yearTH + '-W' + U.pad(m.weekNo) + '-' +
           d.getFullYear() + U.pad(d.getMonth() + 1) + U.pad(d.getDate()) +
           '-r' + m.revision + '.' + (ext || 'html');
  }

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  }

  function bumpMeta(handoffTo) {
    var m = SP.state.meta;
    m.revision = (Number(m.revision) || 0) + 1;
    m.savedAt = U.nowISO();
    m.savedBy = SP.ui.me || m.preparedBy || '';
    m.handoffTo = handoffTo || '';
    m.editsSinceSave = 0;
    m.yearTH = U.yearTH(U.toDate(m.weekOf + 'T00:00:00') || new Date());
    m.weekNo = U.weekNo(U.toDate(m.weekOf + 'T00:00:00') || new Date());
    m.lineage = (m.lineage || []).concat([{
      revision:m.revision, savedBy:m.savedBy, handoffTo:m.handoffTo,
      savedAt:m.savedAt, weekOf:m.weekOf
    }]).slice(-10);
    SP.Store.flush();
  }

  function buildHtml() {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('[data-render-root]').forEach(function (n) { n.innerHTML = ''; });
    clone.querySelectorAll('[data-runtime]').forEach(function (n) { n.parentNode.removeChild(n); });
    clone.querySelectorAll('[data-view]').forEach(function (n) { n.removeAttribute('hidden'); });
    var week = clone.querySelector('#view-week');
    if (week) week.removeAttribute('hidden');
    clone.querySelectorAll('#view-board,#view-plan,#view-discuss,#view-import,#view-settings')
      .forEach(function (n) { n.setAttribute('hidden', ''); });
    /* ประตู PIN ต้องกลับมาเสมอในไฟล์ที่ส่งออก — คนที่เปิดไฟล์ต่อจะได้ถูกถามหนึ่งครั้ง
       (สถานะปลดล็อกเก็บใน spw_v1_ui ซึ่งเป็นของเครื่อง ไม่เดินทางไปกับไฟล์) */
    var gate = clone.querySelector('#pin-gate');
    if (gate) gate.removeAttribute('hidden');
    var t = clone.querySelector('title');
    if (t) t.textContent = SP.state.meta.title;
    clone.querySelector('#seed-data').textContent = embedJson(SP.state);
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  function saveHtml(handoffTo) {
    if (busy) return;
    busy = true;
    setTimeout(function () { busy = false; }, 1200);   // Chrome throttle การดาวน์โหลดรัว ๆ
    bumpMeta(handoffTo);
    var html = buildHtml();
    // ห้ามใส่ BOM — BOM หน้า <!DOCTYPE> ดันบางเบราว์เซอร์เข้า quirks mode
    download(new Blob([html], { type:'text/html;charset=utf-8' }), filename(SP.state.meta, 'html'));
    SP.Render.all();
    SP.Toast.show('บันทึกรอบที่ ' + SP.state.meta.revision + ' แล้ว — ถ้าแก้ไขเพิ่ม ต้องกดบันทึกไฟล์ใหม่อีกครั้ง', 'ok', 6000);
  }

  function askAndSave() {
    var owners = SP.state.owners.filter(function (o) { return o.active; });
    SP.Modal.open({
      title:'บันทึกเป็นไฟล์ HTML — รอบที่ ' + ((SP.state.meta.revision || 1) + 1), icon:'save',
      html:'<p class="muted small">ไฟล์ที่ได้เปิดบนเครื่องไหนก็แก้ต่อได้ทันที ไม่ต้องติดตั้งอะไร ไม่ต้องต่อเน็ต</p>' +
        '<div class="field"><label>บันทึกโดย</label><input class="inp" id="sp-savedby" value="' +
          U.attr(SP.ui.me || SP.state.meta.preparedBy || '') + '" placeholder="ชื่อของคุณ"></div>' +
        '<div class="field"><label>ส่งต่อให้ (ไม่บังคับ)</label><select class="inp" id="sp-handoff">' +
          '<option value="">— ไม่ระบุ —</option>' +
          owners.map(function (o) { return '<option value="' + U.attr(o.name) + '">' + U.esc(o.name) + '</option>'; }).join('') +
        '</select><div class="hint">ระบุแล้ว หัวไฟล์ปลายทางจะอ่านได้ว่าตอนนี้ไม้อยู่ที่ใคร</div></div>' +
        '<div class="banner banner-info" style="margin:12px 0 0">' + U.ic('info') +
          '<span class="small">ส่งทางเมล: บีบอัดเป็น .zip ก่อน (Gmail/Outlook มักตัดไฟล์ .html) — หรือแชร์ผ่าน OneDrive / Google Drive / LINE</span></div>',
      buttons:[{ label:'ยกเลิก', id:'no' }, { label:'บันทึกไฟล์', id:'yes', cls:'btn btn-primary', icon:'save' }],
      onClick: function (id, root) {
        if (id !== 'yes') return;
        var by = root.querySelector('#sp-savedby').value.trim();
        if (by) { SP.ui.me = by; SP.Store.saveUI(); }
        saveHtml(root.querySelector('#sp-handoff').value);
      }
    });
  }

  function saveJson() {
    var name = filename(SP.state.meta, 'json');
    download(new Blob([JSON.stringify(SP.state, null, 1)], { type:'application/json;charset=utf-8' }), name);
    SP.Toast.show('ดาวน์โหลด ' + name + ' แล้ว', 'ok');
  }

  function loadJson() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var doc;
        try { doc = SP.Store.migrate(JSON.parse(r.result)); }
        catch (e) { SP.Toast.show('อ่านไฟล์ JSON ไม่ได้: ' + e.message, 'bad'); return; }
        if (!doc || !doc.meta || !Array.isArray(doc.jobs)) { SP.Toast.show('ไฟล์นี้ไม่ใช่ข้อมูลของ sale-pipeline', 'bad'); return; }
        SP.Modal.confirm({
          title:'นำเข้าข้อมูลจาก JSON?', icon:'upload', danger:true, ok:'แทนที่ข้อมูลทั้งหมด',
          html:'<p>ไฟล์: <b>' + U.esc(f.name) + '</b><br>รอบที่ ' + U.esc(doc.meta.revision || 1) +
               ' · ' + doc.jobs.length + ' งาน · ' + (doc.plans || []).length + ' แผน · ' + (doc.discussions || []).length + ' วาระ</p>' +
               '<p class="muted small">ข้อมูลในเครื่องตอนนี้จะถูกแทนที่ทั้งหมด</p>'
        }, function () {
          SP.Store.pushUndo('นำเข้า JSON: ' + f.name);
          SP.state = doc;
          SP.Store.touch();
          SP.Render.all();
          SP.Toast.show('นำเข้าข้อมูลจาก JSON แล้ว', 'ok');
        });
      };
      r.readAsText(f, 'utf-8');
    };
    inp.click();
  }

  return { saveHtml:saveHtml, askAndSave:askAndSave, saveJson:saveJson, loadJson:loadJson,
           filename:filename, embedJson:embedJson, buildHtml:buildHtml, download:download };
})();

SP.Actions.on('export:html', function () { SP.Export.askAndSave(); });
SP.Actions.on('export:json', function () { SP.Export.saveJson(); });
SP.Actions.on('import:json', function () { SP.Export.loadJson(); });
SP.Actions.on('import:undo', function () {
  var u = SP.Store.popUndo();
  if (!u) { SP.Toast.show('ไม่มีอะไรให้ย้อนกลับ', 'warn'); return; }
  SP.state = SP.Store.migrate(u.doc);
  SP.Store.touch();
  SP.Render.all();
  SP.Toast.show('ย้อนกลับ: ' + u.label, 'ok');
});
</script>

<script>
/* ============================================================================
   BLOCK 12 — VIEW: import  (Excel/CSV wizard 3 ขั้น พร้อมจับคู่คอลัมน์เอง)
   SheetJS โหลดตอนกด "เลือกไฟล์" เท่านั้น — dependency ~900 KB จึงไม่เกี่ยวกับ
   การใช้งานในห้องประชุมเลย ตัดเน็ตแล้วทุกอย่างยกเว้นการนำเข้ายังทำงานครบ
   ========================================================================= */
var SP = window.SP || (window.SP = {});

SP.Imp = (function () {
  'use strict';
  var U = SP.U, C = SP.C;

  var st = { step:0, fileName:'', sheets:[], sheet:'', rows:[], headerRow:0, map:{}, mode:'merge', buf:null, tis:false };

  var TARGETS = [
    { k:'customerName',  th:'ชื่อลูกค้า / โรงพยาบาล', req:true,  kw:['โรงพยาบาล','รพ','ลูกค้า','หน่วยงาน','customer','hospital'] },
    { k:'customerGroup', th:'กลุ่มลูกค้า',            kw:['กลุ่ม','ประเภท','group'] },
    { k:'province',      th:'จังหวัด',                kw:['จังหวัด','พื้นที่','province'] },
    { k:'value',         th:'ยอดโครงการ (บาท)',      kw:['ยอด','มูลค่า','บาท','งบ','amount','value'] },
    { k:'product',       th:'ระบบ / ความต้องการ',     kw:['ระบบ','ความต้องการ','ผลิตภัณฑ์','product'] },
    { k:'productGroup',  th:'หมวดงาน',               kw:['หมวด','กลุ่มงาน','productgroup'] },
    { k:'budgetCode',    th:'ระดับงบ (1–5)',          kw:['budgetlevel','ระดับงบ','level'] },
    { k:'budgetYear',    th:'ปีงบประมาณ',            kw:['ปีงบ','ปีงบประมาณ','fiscal'] },
    { k:'stage',         th:'ขั้นตอนการขาย',          kw:['stage','salestage','สถานะ','ขั้นตอน'] },
    { k:'detail',        th:'รายละเอียด',            kw:['รายละเอียด','detail','note'] },
    { k:'remark',        th:'หมายเหตุ',              kw:['หมายเหตุ','remark','comment'] },
    { k:'assignedTo',    th:'ผู้รับผิดชอบ',           kw:['ผู้รับผิดชอบ','sale','เจ้าของ','owner','ผู้ดูแล'] }
  ];
  var HEADER_VOCAB = /โรงพยาบาล|ลูกค้า|กลุ่ม|จังหวัด|ยอด|มูลค่า|บาท|ระบบ|ความต้องการ|product|budget|level|ปีงบ|stage|สถานะ|รายละเอียด|หมายเหตุ|ผู้รับผิดชอบ/i;

  function colName(i) {
    var s = '';
    i = i + 1;
    while (i > 0) { var r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function norm(s) { return String(s || '').toLowerCase().replace(/[\s​().\/\-–—]/g, ''); }

  function ensureXlsx() {
    return new Promise(function (ok, fail) {
      if (window.XLSX) return ok();
      var s = document.createElement('script');
      s.src = C.XLSX_CDN;
      s.setAttribute('data-runtime', '');     // ให้ export ถอดออก จะได้ไม่ฝัง CDN tag ลงไฟล์
      s.onload = function () { ok(); };
      s.onerror = function () { fail(new Error('offline')); };
      document.head.appendChild(s);
    });
  }

  /* หาแถวหัวตาราง — ใช้ตรรกะ mock-data.js:229-235 เป็นค่าเดาเริ่มต้น
     แต่ต้อง "แสดงให้เห็น" เพราะเดาเงียบ ๆ คือวิธีที่จะได้งาน 24 ชิ้นชื่อ "budget level" */
  function guessHeader(rows) {
    var best = -1, bestScore = 0;
    for (var i = 0; i < Math.min(10, rows.length); i++) {
      var r = rows[i] || [], sc = 0;
      for (var j = 0; j < r.length; j++) if (HEADER_VOCAB.test(String(r[j]))) sc++;
      if (String(r[0]).trim() === '#' || String(r[0]).trim() === 'ที่') sc += 2;
      if (sc > bestScore) { bestScore = sc; best = i; }
    }
    return best >= 0 ? best : 2;
  }

  function autoMap() {
    var hdr = st.rows[st.headerRow] || [];
    var claimed = {}, map = {};
    TARGETS.forEach(function (t) {
      var bestI = -1, bestLen = 0;
      for (var i = 0; i < hdr.length; i++) {
        if (claimed[i]) continue;
        var h = norm(hdr[i]); if (!h) continue;
        for (var k = 0; k < t.kw.length; k++) {
          var w = norm(t.kw[k]);
          if (w && (h.indexOf(w) >= 0 || w.indexOf(h) >= 0) && w.length > bestLen) { bestLen = w.length; bestI = i; }
        }
      }
      if (bestI >= 0) { claimed[bestI] = 1; map[t.k] = bestI; }
      else map[t.k] = -1;
    });
    st.map = map;
  }

  function cell(row, k) {
    var i = st.map[k];
    if (i === undefined || i < 0) return '';
    return String((row && row[i]) === undefined || row[i] === null ? '' : row[i]).trim();
  }

  /* แปลงแถวดิบเป็น job — กฎข้ามแถวตาม §4.4 และเก็บ sectionLabel จากแถวหัวข้อกลุ่ม */
  function parseRows() {
    var out = [], section = '', skip = { section:0, blank:0 };
    for (var i = st.headerRow + 1; i < st.rows.length; i++) {
      var r = st.rows[i] || [];
      var cells = r.map(function (c) { return String(c === undefined || c === null ? '' : c); });
      var nonEmpty = cells.filter(function (c) { return c.trim(); }).length;
      var first = '';
      for (var q = 0; q < cells.length; q++) { if (cells[q].trim()) { first = cells[q].trim(); break; } }
      if (first && SP.Norm.isSectionRow(first)) { section = SP.Norm.sectionLabel(first); skip.section++; continue; }
      var name = cell(r, 'customerName');
      if (!name || nonEmpty <= 1 || /ยอดรวม|รวมทั้งสิ้น|รวม \(/.test(cells.join(','))) { skip.blank++; continue; }

      var stageRaw = cell(r, 'stage');
      var budgetRaw = cell(r, 'budgetCode');
      var valueRaw = cell(r, 'value');
      var budgetCode = SP.Norm.budget(budgetRaw);
      var product = cell(r, 'product');
      var pg = SP.Norm.productGroup(product, cell(r, 'productGroup'));
      var bedRaw = '';
      out.push({
        _row: i + 1, _section: section,
        _warn: {
          value: !!(valueRaw && SP.Norm.value(valueRaw) === 0 && valueRaw !== '-'),
          budget: !!(budgetRaw && !/[1-5]/.test(budgetRaw)),
          stage: !!(stageRaw && SP.Norm.stage(stageRaw) === 'S0' && !/^s0/i.test(stageRaw))
        },
        job: SP.Norm.blankJob({
          customerName: name,
          customerGroup: SP.Norm.customerGroup(cell(r, 'customerGroup')),
          province: cell(r, 'province'),
          sectionLabel: section,
          product: product, productGroup: pg,
          value: SP.Norm.value(valueRaw),
          stage: SP.Norm.stage(stageRaw),
          budgetCode: budgetCode,
          budgetYear: cell(r, 'budgetYear'),
          salesStatus: stageRaw,
          detail: cell(r, 'detail'),
          remark: cell(r, 'remark'),
          assignedTo: U.normNames(cell(r, 'assignedTo')),
          interest: SP.Norm.interest(budgetCode)
        })
      });
    }
    return { list: out, skip: skip };
  }

  /* ---- diff: รวมข้อมูล vs แทนที่ ---------------------------------------- */
  function diff() {
    var p = parseRows(), list = p.list;
    var index = {};
    SP.state.jobs.forEach(function (j) { index[SP.Norm.jobKey(j.customerName, j.productGroup)] = j; });
    var res = { add:[], update:[], same:[], near:[], skip:p.skip, list:list, newOwners:{} };
    list.forEach(function (r) {
      var key = SP.Norm.jobKey(r.job.customerName, r.job.productGroup);
      var hit = index[key];
      U.normNames(r.job.assignedTo).forEach(function (n) { if (!U.ownerByName(n)) res.newOwners[n] = 1; });
      if (hit) {
        var changed = ['stage','value','budgetCode','budgetYear','product','detail','remark','province','customerGroup']
          .some(function (k) { return String(hit[k] || '') !== String(r.job[k] || ''); });
        (changed ? res.update : res.same).push({ row:r, target:hit });
      } else {
        // เกือบตรง — ให้ผู้ใช้ตัดสิน ดีกว่าเดาแล้วรวมผิด
        var nearHit = null;
        SP.state.jobs.forEach(function (j) {
          if (nearHit || j.productGroup !== r.job.productGroup) return;
          if (SP.Norm.levenshtein(j.customerName, r.job.customerName) <= 3) nearHit = j;
        });
        if (nearHit) res.near.push({ row:r, target:nearHit });
        res.add.push(r);
      }
    });
    return res;
  }

  function commit() {
    var d = diff();
    SP.Store.pushUndo('นำเข้า ' + st.fileName);
    var n = { add:0, upd:0 };

    if (st.mode === 'replace') {
      SP.state.jobs = [];
    }
    var index = {};
    SP.state.jobs.forEach(function (j) { index[SP.Norm.jobKey(j.customerName, j.productGroup)] = j; });

    d.list.forEach(function (r) {
      var key = SP.Norm.jobKey(r.job.customerName, r.job.productGroup);
      var hit = index[key];
      if (hit && st.mode === 'merge') {
        /* อัปเดตเฉพาะฟิลด์การค้า — ฟิลด์รายสัปดาห์ทุกตัวต้องรอด */
        if (hit.stage !== r.job.stage) {
          hit.stageHistory = (hit.stageHistory || []).concat([{
            stage:r.job.stage, from:hit.stage, at:U.nowISO(),
            weekOf:SP.state.meta.weekOf, note:'อัปเดตจากไฟล์'
          }]);
        }
        ['stage','value','budgetCode','budgetYear','product','detail','remark','salesStatus','province','customerGroup','sectionLabel']
          .forEach(function (k) { hit[k] = r.job[k]; });
        if (U.normNames(r.job.assignedTo).length) hit.assignedTo = U.normNames(r.job.assignedTo);
        hit.updatedAt = U.nowISO();
        n.upd++;
      } else {
        var j = r.job;
        j.id = U.uid('J');
        j.seedBatch = 'import';
        j.isNewThisWeek = true;                 // prefill เป็นข้อเสนอ ธงยังติ๊กเอง
        j.newSince = U.nowISO();
        j.stageHistory = [{ stage:j.stage, from:null, at:U.nowISO(), weekOf:SP.state.meta.weekOf, note:'นำเข้าจากไฟล์' }];
        SP.state.jobs.push(j);
        index[SP.Norm.jobKey(j.customerName, j.productGroup)] = j;
        n.add++;
      }
    });

    SP.state.meta.lastImport = { fileName:st.fileName, at:U.nowISO(), rows:d.list.length, mode:st.mode };
    SP.Store.touch();
    st.step = 0; st.rows = []; st.buf = null;
    SP.Render.tab('week');
    SP.Toast.show('นำเข้าสำเร็จ — เพิ่มใหม่ ' + n.add + ' · อัปเดต ' + n.upd, 'ok', 6000);
    var orphans = SP.Settings.orphanNames();
    if (orphans.length) SP.Toast.show('พบผู้รับผิดชอบใหม่ ' + orphans.length + ' ชื่อ — เพิ่มได้ที่หน้าตั้งค่า', 'warn', 7000);
  }

  // ---- render -------------------------------------------------------------
  function stepBar() {
    var names = ['เลือกไฟล์', 'จับคู่คอลัมน์', 'ตรวจและยืนยัน'];
    return '<div class="steps">' + names.map(function (nm, i) {
      var cls = st.step === i ? 'step on' : (st.step > i ? 'step ok' : 'step');
      return '<div class="' + cls + '"><span class="n">' + (i + 1) + '</span>' + U.esc(nm) + '</div>';
    }).join('') + '</div>';
  }

  function step0() {
    var li = SP.state.meta.lastImport || {};
    return '<div class="card card-pad stack">' +
      '<div class="banner banner-info">' + U.ic('info') +
        '<div>แนะนำให้ใช้ไฟล์ <b>.xlsx</b> — ไม่มีปัญหาภาษาไทยเพี้ยน · ไฟล์ .csv ที่ Excel ไทยเซฟมามักเป็น TIS-620 ระบบจะตรวจให้และเสนออ่านใหม่</div></div>' +
      '<div><button class="btn btn-primary" data-act="imp:pick">' + U.ic('upload') + 'เลือกไฟล์ Excel / CSV</button></div>' +
      (li.fileName ? '<div class="small muted">' + U.ic('history') + ' นำเข้าล่าสุด: ' + U.esc(li.fileName) +
        (li.at ? ' · ' + U.esc(U.fmtDate(li.at, 'datetime')) : '') + ' · ' + U.esc(li.rows || 0) + ' แถว</div>' : '') +
    '</div>';
  }

  function rawPreview() {
    var max = Math.min(st.rows.length, 10);
    var wide = 0;
    for (var i = 0; i < max; i++) wide = Math.max(wide, (st.rows[i] || []).length);
    var head = '<tr><th class="rn">แถว</th>';
    for (var c = 0; c < wide; c++) head += '<th>' + colName(c) + '</th>';
    head += '</tr>';
    var body = '';
    for (var r = 0; r < max; r++) {
      body += '<tr class="' + (r === st.headerRow ? 'is-header' : '') + '"><td class="rn">' + (r + 1) + '</td>';
      for (var k = 0; k < wide; k++) body += '<td>' + U.esc((st.rows[r] || [])[k] || '') + '</td>';
      body += '</tr>';
    }
    return '<div class="raw-preview"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  function step1() {
    var hdr = st.rows[st.headerRow] || [];
    var wide = 0;
    st.rows.slice(0, 30).forEach(function (r) { wide = Math.max(wide, (r || []).length); });

    function sampleOf(i) {
      for (var r = st.headerRow + 1; r < Math.min(st.rows.length, st.headerRow + 12); r++) {
        var v = String(((st.rows[r] || [])[i]) || '').trim();
        if (v && !SP.Norm.isSectionRow(v)) return v;
      }
      return '';
    }
    var cols = [];
    for (var i = 0; i < wide; i++) {
      var h = String(hdr[i] || '').trim();
      var sm = sampleOf(i);
      cols.push({ i:i, label: colName(i) + ' — ' + (h || '(ไม่มีหัวคอลัมน์)') + (sm ? '  ตัวอย่าง: ' + sm : '') });
    }

    var grid = TARGETS.map(function (t) {
      var cur = st.map[t.k];
      return '<div class="map-row' + (t.req ? ' req' : '') + '">' +
        '<span class="mlab">' + U.esc(t.th) + (t.req ? ' *' : '') + '</span>' +
        '<select class="inp" data-act-change="imp:map" data-k="' + t.k + '">' +
          '<option value="-1"' + (cur === -1 ? ' selected' : '') + '>— ไม่ใช้ —</option>' +
          cols.map(function (c) {
            return '<option value="' + c.i + '"' + (c.i === cur ? ' selected' : '') + '>' + U.esc(c.label) + '</option>';
          }).join('') +
        '</select></div>';
    }).join('');

    var p = parseRows();
    var prev = p.list.slice(0, 5).map(function (r) {
      var w = [];
      if (r._warn.value) w.push('ยอดเงินอ่านไม่ออก');
      if (r._warn.budget) w.push('ระดับงบอ่านไม่ออก');
      if (r._warn.stage) w.push('ขั้นตอนอ่านไม่ออก');
      return '<div class="job" style="border-color:' + (C.STAGE_COLORS[r.job.stage] || '#98A2B3') + '">' +
        '<div class="job-name">' + U.esc(r.job.customerName) + '<div class="small muted" style="font-weight:400">' + U.esc(r.job.product) + '</div></div>' +
        '<div class="job-meta">' + U.stageBadge(r.job.stage) + U.groupBadge(r.job.productGroup) + U.levelBadge(r.job.budgetCode) +
          (r.job.budgetYear ? '<span class="badge badge-soft">ปีงบ ' + U.esc(r.job.budgetYear) + '</span>' : '') + '</div>' +
        '<div class="job-meta tiny muted">' + U.esc(r.job.customerGroup) + (r.job.province ? ' · ' + U.esc(r.job.province) : '') +
          (r._section ? ' · กลุ่ม: ' + U.esc(r._section) : '') + '</div>' +
        '<div class="job-meta">' + U.moneyOrPending(r.job.value) + '</div>' +
        (w.length ? '<div class="job-note" style="background:#FFFAEB;color:#93370D">' + U.ic('alert') + ' ' + U.esc(w.join(' · ')) + '</div>' : '') +
      '</div>';
    }).join('');

    return '<div class="card card-pad stack">' +
      '<div class="center" style="flex-wrap:wrap">' +
        '<b>' + U.ic('sheet') + ' ' + U.esc(st.fileName) + '</b>' +
        (st.sheets.length > 1
          ? '<select class="inp" style="max-width:180px" data-act-change="imp:sheet">' + U.opt(st.sheets, st.sheet) + '</select>'
          : '') +
        '<label class="center" style="gap:6px"><span class="small">แถวหัวตาราง</span>' +
          '<input class="inp" type="number" min="1" max="' + st.rows.length + '" style="width:80px" data-act-change="imp:header" value="' + (st.headerRow + 1) + '"></label>' +
        (st.tis ? '<button class="btn btn-sm" data-act="imp:tis">' + U.ic('refresh') + 'อ่านใหม่แบบ TIS-620</button>' : '') +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm" data-act="imp:reset">' + U.ic('close') + 'เริ่มใหม่</button>' +
      '</div>' +
      rawPreview() +
      '<div class="banner banner-info">' + U.ic('info') +
        '<div>รหัสขั้นในไฟล์ถือเป็น<b>ชุดเดิม S0–S9</b> ระบบจะแปลงเป็นชุดใหม่ S0–S10 ให้อัตโนมัติ ' +
        '(S7 และ S6 รวมเป็นขั้นเดียว · S7_WON กลายเป็น “กำลังดำเนินงาน”) — ดูผลจริงได้ในตัวอย่างด้านล่าง</div></div>' +
      '<div class="banner banner-warn">' + U.ic('alert') +
        '<div>ไฟล์ต้นทางของทีมมี <b>คอลัมน์ D ที่ไม่มีหัวตาราง</b> แต่เก็บ “จังหวัด” ไว้ — ระบบเดาให้ไม่ได้ ' +
        'ให้ดูค่าตัวอย่างในวงเล็บแล้วเลือกเอง (นี่คือเหตุผลที่ต้องมีขั้นจับคู่คอลัมน์)</div></div>' +
      '<div class="map-grid">' + grid + '</div>' +
      '<div><b>ตัวอย่างผลลัพธ์ 5 แถวแรก</b> <span class="small muted">— เปลี่ยนการจับคู่แล้วดูผลทันที</span></div>' +
      '<div class="p-grid">' + (prev || '<div class="empty">ยังไม่มีแถวข้อมูลที่อ่านได้ — ลองปรับแถวหัวตาราง</div>') + '</div>' +
      '<div class="small muted">อ่านได้ ' + p.list.length + ' แถว · ข้าม ' + (p.skip.section + p.skip.blank) +
        ' แถว (หัวข้อกลุ่ม ' + p.skip.section + ', แถวว่าง/ยอดรวม ' + p.skip.blank + ')</div>' +
      '<div class="btn-group">' +
        '<button class="btn btn-primary" data-act="imp:next"' + (st.map.customerName >= 0 && p.list.length ? '' : ' disabled') + '>' +
          U.ic('chevron-right') + 'ถัดไป — ตรวจและยืนยัน</button>' +
      '</div></div>';
  }

  function step2() {
    var d = diff();
    var newOwners = Object.keys(d.newOwners);
    return '<div class="card card-pad stack">' +
      '<div class="diff">' +
        '<span>เพิ่มใหม่ <b style="color:#027A48">' + d.add.length + '</b></span>' +
        '<span>อัปเดต <b style="color:#175CD3">' + d.update.length + '</b></span>' +
        '<span>ไม่เปลี่ยน <b>' + d.same.length + '</b></span>' +
        '<span>ข้าม <b>' + (d.skip.section + d.skip.blank) + '</b></span>' +
        (d.near.length ? '<span>ต้องตรวจสอบ <b style="color:#B54708">' + d.near.length + '</b></span>' : '') +
        (newOwners.length ? '<span>ผู้รับผิดชอบใหม่ <b style="color:#B54708">' + newOwners.length + '</b></span>' : '') +
      '</div>' +
      (d.near.length
        ? '<div class="banner banner-warn">' + U.ic('alert') + '<div><b>ชื่อคล้ายของเดิม — ตรวจก่อนว่าซ้ำกันไหม</b><ul style="margin:6px 0 0;padding-left:18px">' +
          d.near.map(function (n) {
            return '<li>' + U.esc(n.row.job.customerName) + ' <span class="muted">คล้ายกับ</span> ' + U.esc(n.target.customerName) + '</li>';
          }).join('') + '</ul></div></div>'
        : '') +
      (newOwners.length
        ? '<div class="banner banner-info">' + U.ic('users') + '<div>พบผู้รับผิดชอบที่ยังไม่อยู่ในรายชื่อ: <b>' +
          newOwners.map(U.esc).join(', ') + '</b> — เพิ่มได้ที่หน้าตั้งค่าหลังนำเข้า</div></div>'
        : '') +
      '<div><b>วิธีนำเข้า</b></div>' +
      '<label class="check"><input type="radio" name="impmode" value="merge" data-act-change="imp:mode"' + (st.mode === 'merge' ? ' checked' : '') + '>' +
        'รวมข้อมูล (แนะนำ) — อัปเดตงานเดิมที่ชื่อ+หมวดตรงกัน และเก็บธง “ใหม่” / เหตุผลที่หยุด / ผู้รับผิดชอบ / การซ่อนตอนนำเสนอ ไว้ครบ</label>' +
      '<label class="check"><input type="radio" name="impmode" value="replace" data-act-change="imp:mode"' + (st.mode === 'replace' ? ' checked' : '') + '>' +
        'แทนที่ทั้งหมด — ลบงานเดิมทุกรายการแล้วใส่ของใหม่ (แผนงานและวาระไม่ถูกลบ แต่จะขึ้นป้ายว่างานที่อ้างถึงถูกลบ)</label>' +
      (st.mode === 'replace'
        ? '<div class="banner banner-bad">' + U.ic('alert') + '<div><b>คำเตือน:</b> คำอธิบายรายสัปดาห์ทั้งหมด (ธง “ใหม่”, เหตุผลที่หยุด, สิ่งที่รอ, ผู้รับผิดชอบ, การซ่อนตอนนำเสนอ) ของงาน ' +
          SP.state.jobs.length + ' รายการจะหายทั้งหมด</div></div>'
        : '') +
      '<div class="btn-group">' +
        '<button class="btn" data-act="imp:back">' + U.ic('chevron-left') + 'กลับไปแก้การจับคู่</button>' +
        '<button class="btn btn-primary" data-act="imp:commit">' + U.ic('check') + 'นำเข้าข้อมูล</button>' +
        '<button class="btn" data-act="imp:reset">' + U.ic('close') + 'ยกเลิก</button>' +
      '</div></div>';
  }

  function render() {
    return '<div class="sect-hd"><h2>' + U.ic('import', 'ic-lg') + 'นำเข้าข้อมูลจาก Excel / CSV</h2></div>' +
      stepBar() +
      (st.step === 0 ? step0() : st.step === 1 ? step1() : step2());
  }

  // ---- file handling ------------------------------------------------------
  function readWorkbook(wbData, type) {
    var wb = XLSX.read(wbData, type === 'string' ? { type:'string' } : { type:'array', cellDates:true });
    st.sheets = wb.SheetNames;
    st.sheet = st.sheet && wb.SheetNames.indexOf(st.sheet) >= 0 ? st.sheet : wb.SheetNames[0];
    st.rows = XLSX.utils.sheet_to_json(wb.Sheets[st.sheet], { header:1, defval:'', blankrows:false, raw:true });
    st.headerRow = guessHeader(st.rows);
    autoMap();
    st.step = 1;
    SP.Render.current();
  }

  function pick() {
    ensureXlsx().then(function () {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
      inp.onchange = function () {
        var f = inp.files && inp.files[0]; if (!f) return;
        st.fileName = f.name; st.sheet = ''; st.tis = false;
        var r = new FileReader();
        r.onload = function () {
          st.buf = r.result;
          if (/\.csv$/i.test(f.name)) {
            var txt = new TextDecoder('utf-8').decode(new Uint8Array(r.result)).replace(/^﻿/, '');
            /* Excel ไทยมักเซฟ CSV เป็น windows-874/TIS-620 ไม่ใช่ UTF-8 */
            if (/�/.test(txt) || (/à¸|à¹/.test(txt) && !/[฀-๿]/.test(txt))) st.tis = true;
            readWorkbook(txt, 'string');
          } else {
            readWorkbook(new Uint8Array(r.result), 'array');
          }
        };
        r.readAsArrayBuffer(f);
      };
      inp.click();
    }).catch(function () {
      SP.Toast.show('ต้องต่ออินเทอร์เน็ตเพื่อนำเข้าไฟล์ Excel — ส่วนอื่นของหน้านี้ใช้งานได้ตามปกติ', 'bad', 8000);
    });
  }

  return {
    st:st, render:render, pick:pick, diff:diff, commit:commit, parseRows:parseRows,
    autoMap:autoMap, readWorkbook:readWorkbook, TARGETS:TARGETS
  };
})();

SP.Render.register('import', SP.Imp.render);

SP.Actions.on('imp:pick',  function () { SP.Imp.pick(); });
SP.Actions.on('imp:next',  function () { SP.Imp.st.step = 2; SP.Render.current(); });
SP.Actions.on('imp:back',  function () { SP.Imp.st.step = 1; SP.Render.current(); });
SP.Actions.on('imp:reset', function () {
  SP.Imp.st.step = 0; SP.Imp.st.rows = []; SP.Imp.st.buf = null; SP.Imp.st.fileName = '';
  SP.Render.current();
});
SP.Actions.on('imp:commit', function () { SP.Imp.commit(); });
SP.Actions.on('imp:tis', function () {
  var st = SP.Imp.st;
  if (!st.buf) return;
  try {
    var txt = new TextDecoder('windows-874').decode(new Uint8Array(st.buf)).replace(/^﻿/, '');
    st.tis = false;
    SP.Imp.readWorkbook(txt, 'string');
    SP.Toast.show('อ่านไฟล์ใหม่แบบ TIS-620 แล้ว', 'ok');
  } catch (e) {
    SP.Toast.show('เบราว์เซอร์นี้ไม่รองรับการถอดรหัส TIS-620 — กรุณาบันทึกไฟล์เป็น .xlsx แทน', 'bad', 7000);
  }
});
</script>

<script>
/* ============================================================================
   BLOCK 13 — BOOT  (บล็อกเดียวที่มี side effect ตอนโหลด)
   หมายเหตุสำคัญสำหรับคนที่จะมาแก้ไฟล์นี้ต่อ:
   - ห้ามเปลี่ยนไปใช้ fetch() ดึงไฟล์ในเครื่อง — บน file:// origin เป็น opaque
     การ fetch จะล้มเหลวเสมอ ข้อมูลตั้งต้นและ SVG sprite ต้อง inline เท่านั้น
   - ห้ามใช้ <script type="module"> — Chrome บล็อกด้วย CORS บน file://
   - ห้าม re-render ตอน event 'input' เพราะ caret จะกระโดดกลางคำ
   ========================================================================= */
var SP = window.SP || (window.SP = {});

(function () {
  'use strict';
  var U = SP.U;

  // ---- event delegation ทั้งหน้า -----------------------------------------
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    e.preventDefault();
    SP.Actions.run(t.getAttribute('data-act'), t.dataset, e);
  });

  /* change = เขียน state แล้ว re-render ได้ */
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-field')) { SP.Actions.field(t, true); return; }
    var ac = t.getAttribute && t.getAttribute('data-act-change');
    if (!ac) return;
    if (ac === 'imp:map')    { SP.Imp.st.map[t.dataset.k] = Number(t.value); SP.Render.current(); }
    else if (ac === 'imp:sheet')  { SP.Imp.st.sheet = t.value; SP.Imp.readWorkbook(SP.Imp.st.buf ? new Uint8Array(SP.Imp.st.buf) : null, 'array'); }
    else if (ac === 'imp:header') { SP.Imp.st.headerRow = Math.max(0, Number(t.value) - 1); SP.Imp.autoMap(); SP.Render.current(); }
    else if (ac === 'imp:mode')   { SP.Imp.st.mode = t.value; SP.Render.current(); }
    else if (ac === 'ui:me')      { SP.ui.me = t.value; SP.Store.saveUI(); SP.Render.current(); }
    else if (ac === 'owner:name') { renameOwner(t.dataset.id, t.value); }
  });

  /* input = เขียน state + autosave เท่านั้น ห้าม re-render */
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-field')) { SP.Actions.field(t, false); return; }
    var ai = t.getAttribute && t.getAttribute('data-act-input');
    if (!ai) return;
    if (ai === 'board:text') { SP.Board.f().text = t.value; clearTimeout(t._tm); t._tm = setTimeout(function () { SP.Render.current(); }, 300); }
    else if (ai === 'contact') {
      var j = U.byId(SP.state.jobs, t.dataset.id);
      if (j && j.contacts[Number(t.dataset.i)]) { j.contacts[Number(t.dataset.i)][t.dataset.k] = t.value; SP.Store.touch(); }
    }
    else if (ai === 'owner:name') { /* รอ change เพื่อ cascade ทีเดียว */ }
  });

  /* ลากเพื่อเลื่อนบอร์ด — เริ่มจับจริงเมื่อลากเกิน 6px เพื่อไม่ให้กินการคลิกปุ่ม
     และกลืน click ที่ตามมาหลังลาก ไม่งั้นลากทับการ์ดแล้วฟอร์มแก้ไขจะเด้งขึ้นมาเอง */
  var pan = null, swallowClick = false;
  document.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || !e.target.closest) return;
    var board = e.target.closest('.board');
    if (!board) return;
    if (e.target.closest('input,textarea,select,option,a')) return;
    pan = { board: board, x: e.clientX, y: e.clientY, left: board.scrollLeft, active: false };
  });
  document.addEventListener('pointermove', function (e) {
    if (!pan) return;
    var dx = e.clientX - pan.x;
    if (!pan.active) {
      if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(e.clientY - pan.y)) return;
      pan.active = true;
      pan.board.classList.add('panning');
    }
    pan.board.scrollLeft = pan.left - dx;
    if (e.cancelable) e.preventDefault();
  });
  function endPan() {
    if (!pan) return;
    if (pan.active) { pan.board.classList.remove('panning'); swallowClick = true; }
    pan = null;
  }
  document.addEventListener('pointerup', endPan);
  document.addEventListener('pointercancel', endPan);
  document.addEventListener('click', function (e) {
    if (!swallowClick) return;
    swallowClick = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (SP.Modal.isOpen()) { SP.Modal.close(); return; }
    if (SP.Drawer.isOpen()) { SP.Drawer.close(); }
  });

  /* แก้ชื่อผู้รับผิดชอบ -> เปลี่ยนตามไปทุกที่ที่อ้างถึง พร้อมบอกจำนวนก่อนยืนยัน */
  function renameOwner(id, to) {
    var o = U.byId(SP.state.owners, id);
    if (!o) return;
    to = String(to || '').trim();
    var from = o.name;
    if (!to || to === from) { SP.Render.current(); return; }
    if (SP.state.owners.some(function (x) { return x.id !== id && x.name === to; })) {
      SP.Toast.show('มีชื่อ "' + to + '" อยู่แล้ว', 'bad');
      SP.Render.current();
      return;
    }
    var r = SP.Settings.refs(from);
    function apply() {
      SP.Settings.renameEverywhere(from, to);
      o.name = to;
      SP.Store.touch();
      SP.Render.current();
    }
    if (!r.total) { apply(); return; }
    SP.Modal.confirm({
      title:'เปลี่ยนชื่อเป็น "' + to + '"?', icon:'edit', ok:'เปลี่ยนทั้งหมด',
      html:'<p>จะเปลี่ยนชื่อใน <b>' + r.jobs.length + ' งาน · ' + r.plans.length + ' แผนงาน · ' + r.discussions.length + ' วาระ</b></p>'
    }, apply);
    SP.Modal.el().addEventListener('click', function h(ev) {
      var b = ev.target.closest && ev.target.closest('[data-id="no"]');
      if (b) { SP.Render.current(); SP.Modal.el().removeEventListener('click', h); }
    });
  }

  /* เตือนตอนปิดเฉพาะเมื่อมีการแก้หลังบันทึกไฟล์ — เตือนทุกครั้งคือเตือนที่ถูกกดผ่าน */
  window.addEventListener('beforeunload', function (e) {
    if (SP.state && (SP.state.meta.editsSinceSave || 0) > 0) { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  // ---- boot ---------------------------------------------------------------
  function askWhichVersion(seed, saved, why) {
    var edits = saved.meta.editsSinceSave || 0;
    var html;
    if (why === 'fileNewer') {
      html = '<p>ไฟล์นี้เป็น <b>รอบที่ ' + U.esc(seed.meta.revision) + '</b>' +
             (seed.meta.savedBy ? ' บันทึกโดย <b>' + U.esc(seed.meta.savedBy) + '</b>' : '') +
             (seed.meta.savedAt ? ' เมื่อ ' + U.esc(U.fmtDate(seed.meta.savedAt, 'datetime')) : '') + '</p>' +
             '<p>ข้อมูลในเครื่องนี้เป็น <b>รอบที่ ' + U.esc(saved.meta.revision) + '</b></p>' +
             (edits > 0
               ? '<div class="banner banner-bad">' + U.ic('alert') + '<div><b>ในเครื่องนี้มีการแก้ไข ' + edits +
                 ' ครั้ง หลังส่งไฟล์รอบที่ ' + U.esc(saved.meta.revision) + ' ออกไป</b><br>' +
                 'ถ้าเลือกใช้ไฟล์ใหม่ การแก้ไขเหล่านั้นจะหาย — กด “ดาวน์โหลดของในเครื่อง” เก็บไว้ก่อนได้</div></div>'
               : '<p class="muted small">ในเครื่องนี้ไม่มีการแก้ไขค้างอยู่ ใช้ไฟล์ใหม่ได้เลย</p>');
    } else {
      html = '<p>ไฟล์ที่เปิดเป็น <b>รอบที่ ' + U.esc(seed.meta.revision) + '</b> ' +
             'แต่ข้อมูลในเครื่องนี้เป็น <b>รอบที่ ' + U.esc(saved.meta.revision) + '</b> ซึ่งใหม่กว่า</p>' +
             '<p class="muted small">มักเกิดตอนเผลอเปิดไฟล์แนบเก่าในเมล</p>';
    }
    SP.Modal.open({
      title: why === 'fileNewer' ? 'ไฟล์นี้ใหม่กว่าข้อมูลในเครื่อง' : 'ข้อมูลในเครื่องใหม่กว่าไฟล์นี้',
      icon:'users', html:html,
      buttons: why === 'fileNewer'
        ? [{ label:'ดาวน์โหลดของในเครื่อง (JSON)', id:'dl', cls:'btn', icon:'download' },
           { label:'เก็บของในเครื่องไว้', id:'local', cls:'btn' },
           { label:'ใช้ไฟล์รอบที่ ' + seed.meta.revision, id:'file', cls:'btn btn-primary' }]
        : [{ label:'ย้อนไปใช้ไฟล์รอบที่ ' + seed.meta.revision, id:'file', cls:'btn' },
           { label:'เก็บของในเครื่องไว้', id:'local', cls:'btn btn-primary' }],
      onClick: function (id) {
        if (id === 'dl') {
          var name = 'sale-pipeline-local-backup-r' + saved.meta.revision + '.json';
          SP.Export.download(new Blob([JSON.stringify(saved, null, 1)], { type:'application/json;charset=utf-8' }), name);
          return true;                       // เปิด modal ค้างไว้ ให้เลือกต่อ
        }
        finish(id === 'file' ? seed : saved, id === 'file' ? seed : null);
      }
    });
  }

  function finish(doc, received) {
    SP.Store.use(doc);
    SP.Store.flush();
    if (!SP.ui.activeTab) SP.ui.activeTab = 'week';
    SP.Render.all();
    if (received && received.meta.savedBy) {
      SP.Toast.show('รับไฟล์รอบที่ ' + received.meta.revision + ' จาก ' + received.meta.savedBy +
                    (received.meta.handoffTo ? ' (ส่งต่อให้ ' + received.meta.handoffTo + ')' : ''), 'ok', 8000);
    }
    askWhoAmI();
  }

  /* ถามครั้งเดียวต่อเครื่อง — ใช้เป็นชื่อผู้บันทึกตอนส่งต่อ และค่าเริ่มต้นของงานใหม่
     เก็บใน spw_v1_ui ไม่ใช่ในเอกสาร เพราะเอกสารเดินทางข้ามเครื่อง */
  function askWhoAmI() {
    var owners = SP.state.owners.filter(function (o) { return o.active; });
    if (!owners.length) return;
    if (SP.ui.me && U.ownerByName(SP.ui.me)) return;
    if (SP.ui.me && !U.ownerByName(SP.ui.me)) SP.ui.me = '';
    SP.Modal.open({
      title:'คุณคือใคร?', icon:'user',
      html:'<p class="muted small">ใช้เป็นชื่อผู้บันทึกตอนส่งไฟล์ต่อ และเป็นผู้รับผิดชอบเริ่มต้นของงานใหม่<br>' +
           'ค่านี้เก็บไว้เฉพาะเครื่องนี้ ไม่เดินทางไปกับไฟล์ · เปลี่ยนได้ที่หน้าตั้งค่า</p>' +
           '<div class="field"><select class="inp" id="sp-me">' +
           '<option value="">— ยังไม่ระบุ —</option>' +
           owners.map(function (o) { return '<option value="' + U.attr(o.name) + '">' + U.esc(o.name) + '</option>'; }).join('') +
           '</select></div>',
      buttons:[{ label:'ข้ามไปก่อน', id:'no' }, { label:'บันทึก', id:'yes', cls:'btn btn-primary' }],
      onClick: function (id, root) {
        if (id !== 'yes') return;
        SP.ui.me = root.querySelector('#sp-me').value;
        SP.Store.saveUI();
        SP.Render.current();
      }
    });
  }


  /* ---- ประตู PIN ----------------------------------------------------------
     กันคนเปิดผ่าน ๆ เท่านั้น ไม่ใช่ระบบความปลอดภัยจริง: PIN อยู่ในซอร์สของไฟล์
     ใครกด view-source ก็เห็น (แนวเดียวกับ index.html ของแอปหลัก)
     ปลดล็อกแล้วจำไว้ในเครื่องนั้น (spw_v1_ui) จึงถามเฉพาะครั้งแรก —
     ไฟล์ที่ส่งต่อไปเครื่องอื่นจะถามใหม่หนึ่งครั้ง ซึ่งเป็นสิ่งที่ต้องการ */
  var PIN = '10210';

  function gateEl() { return document.getElementById('pin-gate'); }

  function unlock(afterUnlock) {
    var g = gateEl();
    if (g) g.hidden = true;
    SP.ui.unlocked = true;
    SP.Store.saveUI();
    afterUnlock();
  }

  function guard(afterUnlock) {
    var g = gateEl();
    if (!g) { afterUnlock(); return; }          // ไม่มีประตูก็ผ่านไป
    if (SP.ui.unlocked) { g.hidden = true; afterUnlock(); return; }

    g.hidden = false;
    var inp = document.getElementById('pin-input');
    var msg = document.getElementById('pin-msg');
    var btn = document.getElementById('pin-go');

    function fail() {
      msg.textContent = 'รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง';
      var card = g.querySelector('.pin-card');
      card.classList.remove('pin-shake');
      void card.offsetWidth;                     // บังคับ reflow ให้ animation เล่นซ้ำได้
      card.classList.add('pin-shake');
      inp.value = '';
      inp.focus();
    }
    function tryPin() {
      if (inp.value === PIN) unlock(afterUnlock); else fail();
    }

    inp.addEventListener('input', function () {
      msg.textContent = '';
      if (inp.value.length === PIN.length) tryPin();   // ครบ 5 หลักแล้วตรวจให้เลย
    });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); tryPin(); }
    });
    btn.addEventListener('click', function (e) { e.preventDefault(); tryPin(); });
    try { inp.focus(); } catch (e) {}
  }

  function boot() {
    SP.Store.loadUI();
    guard(startApp);
  }

  function startApp() {
    var seed = SP.Store.readSeed();
    if (!seed) {
      document.getElementById('view-week').innerHTML =
        '<div class="banner banner-bad">' + U.ic('alert') + 'อ่านข้อมูลที่ฝังในไฟล์ไม่ได้ — ไฟล์อาจเสียหายระหว่างส่ง ลองขอไฟล์ใหม่อีกครั้ง</div>';
      return;
    }
    var saved = SP.Store.readLocal(seed.meta.docId);
    var d = SP.Store.decide(seed, saved);
    if (d.use === 'seed')       finish(seed, saved ? null : (seed.meta.savedBy ? seed : null));
    else if (d.use === 'local') finish(saved);
    else                        { SP.Store.use(saved); askWhichVersion(seed, saved, d.why); }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
